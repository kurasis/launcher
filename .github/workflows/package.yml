name: Package

# Builds private qualification packages for every claimed target, smoke-tests
# them, and records checksums and build metadata (docs/spec/07, phase P12).
# Packages are kept as workflow artifacts; with the update key, the release job
# adds the signed update archive (docs/RELEASING.md). Nothing here creates a
# GitHub release or deploys anything. Signing credentials are read only on trusted
# events (push to main, manual dispatch) and only when the owner configured them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Non-secret build configuration (docs/AUTH-SETUP.md); blank means "not configured".
  LAUNCHER_MSA_CLIENT_ID: ${{ vars.LAUNCHER_MSA_CLIENT_ID }}
  # The update public key built into the launcher (D-063); blank: no updates.
  LAUNCHER_UPDATE_PUBKEY: ${{ vars.UPDATE_PUBLIC_KEY }}
  RETENTION_DAYS: ${{ github.event_name == 'pull_request' && 7 || 30 }}

jobs:
  linux:
    name: Build linux-x64 (Debian 12 baseline)
    runs-on: ubuntu-24.04
    # The oldest qualified glibc/WebKitGTK baseline (D-008): packages built here
    # also run on newer distributions, not the other way round.
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config xz-utils \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustc" --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: debian12

      - run: npm ci

      - name: Build .deb and AppImage
        env:
          # linuxdeploy is itself an AppImage; containers have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --ci --bundles deb,appimage -- --locked

      - name: Checksums and build metadata
        run: |
          node scripts/package-metadata.mjs --target linux-x64 --out dist-packages \
            --signing "unsigned (Linux packages are not signed)" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v5
        with:
          name: launcher-linux-x64
          path: dist-packages
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  linux-smoke:
    name: Smoke linux-x64 (${{ matrix.image }})
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Fresh systems: no Rust, Node or Java.
        image: ['debian:12', 'ubuntu:24.04']
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/smoke
      - uses: actions/download-artifact@v5
        with:
          name: launcher-linux-x64
          path: packages
      - run: scripts/smoke/linux.sh packages/*.deb packages/*.AppImage

  windows:
    name: Build and smoke ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
          # Windows 11 on ARM: the native arm64 build, and the place where the
          # interface is checked on Windows 11.
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install rustup (Windows on ARM images may lack it)
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build NSIS installer
        run: npx tauri build --ci --bundles nsis -- --locked

      - name: Checksums and build metadata
        run: |
          node scripts/package-metadata.mjs --target ${{ matrix.name }} --out dist-packages \
            --signing "unsigned (no code-signing certificate configured)" \
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Smoke test (install, start, console and player windows, uninstall)
        shell: pwsh
        run: scripts/smoke/windows.ps1 -Installer (Get-Item dist-packages/*-setup.exe).FullName

      - name: Console and player window screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: console-window-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/console-window.png
            ${{ runner.temp }}/player-window.png
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: launcher-${{ matrix.name }}
          path: dist-packages
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  macos:
    name: Build and smoke ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Intel Macs are few on GitHub (a long wait) and slow (twice the build
      # time), so pull requests build arm64 only; main, manual runs and the
      # release archive build both. CI checks the Rust core on both always.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"name": "macos-arm64", "os": "macos-15"}]'
          || '[{"name": "macos-arm64", "os": "macos-15"}, {"name": "macos-x64", "os": "macos-15-intel"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Owner-configured signing and notarization (docs/PACKAGING.md). Never on
      # pull requests; skipped when the secrets are absent.
      - name: Load signing configuration
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
            status="signed with the owner's Developer ID"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                echo "$name=${!name}" >> "$GITHUB_ENV"
              done
              status="$status, notarized"
            fi
            echo "SIGNING_STATUS=$status" >> "$GITHUB_ENV"
          fi

      - name: Build app and DMG
        run: npx tauri build --ci --bundles app,dmg -- --locked

      - name: Checksums and build metadata
        run: |
          node scripts/package-metadata.mjs --target ${{ matrix.name }} --out dist-packages \
            --signing "${SIGNING_STATUS:-unsigned (no Developer ID configured)}" \
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Updater bundle (the .app the updater puts in place, D-063)
        run: |
          tar -czf "dist-packages/Launcher-${{ matrix.name }}.app.tar.gz" \
            -C src-tauri/target/release/bundle/macos Launcher.app

      - name: Smoke test (mount, start, remove)
        run: scripts/smoke/macos.sh dist-packages/*.dmg

      - uses: actions/upload-artifact@v5
        with:
          name: launcher-${{ matrix.name }}
          path: dist-packages
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  # The release archive for upd.lapi.sh (D-063): every platform's files,
  # signed for the version with the update key, and release.json. Only on
  # trusted events and only when the owner configured the key; the owner then
  # uploads it and runs `lapi-upd publish` on the server.
  release:
    name: Release archive
    needs: [linux, windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Signing key configured?
        id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret: no release archive (docs/DECISIONS.md D-063)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
      - uses: actions/download-artifact@v5
        if: steps.key.outputs.present == 'true'
        with:
          pattern: launcher-*
          path: artifacts
      - name: Build lapi-upd
        if: steps.key.outputs.present == 'true'
        run: cargo build --locked --release --manifest-path services/upd/Cargo.toml
      - name: Sign and pack
        if: steps.key.outputs.present == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          notes=()
          if [ -f "release-notes/$version.json" ]; then
            notes=(--notes "release-notes/$version.json")
          else
            echo "::warning::No release-notes/$version.json: the update has no notes."
          fi
          one() { ls $1 | head -1; }
          mkdir -p release
          services/upd/target/release/lapi-upd pack "$version" \
            --out "release/launcher-$version-release.tar.gz" "${notes[@]}" \
            "windows-x86_64:nsis:$(one 'artifacts/launcher-windows-x64/*-setup.exe')" \
            "windows-aarch64:nsis:$(one 'artifacts/launcher-windows-arm64/*-setup.exe')" \
            "darwin-aarch64:app:$(one 'artifacts/launcher-macos-arm64/*.app.tar.gz')" \
            "darwin-x86_64:app:$(one 'artifacts/launcher-macos-x64/*.app.tar.gz')" \
            "linux-x86_64:appimage:$(one 'artifacts/launcher-linux-x64/*.AppImage')" \
            "linux-x86_64:deb:$(one 'artifacts/launcher-linux-x64/*.deb')"
      - uses: actions/upload-artifact@v5
        if: steps.key.outputs.present == 'true'
        with:
          name: launcher-${{ env.VERSION }}-release
          path: release
          retention-days: 30
          if-no-files-found: error
