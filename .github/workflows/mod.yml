name: Skins mod

# Launcher Skins (docs/DECISIONS.md D-065): the core's tests and a jar for every
# loader and game version, kept as artifacts. Nothing here talks to the server.

on:
  push:
    branches: [main]
    paths:
      - mod/**
      - .github/workflows/mod.yml
  pull_request:
    paths:
      - mod/**
      - .github/workflows/mod.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4
      # Java 21 builds the jars for 1.21.x; Gradle and Fabric Loom run on 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-skins
          path: |
            mod/*/*/build/libs/launcherskins-*.jar
            !mod/*/*/build/libs/*-sources.jar
          retention-days: 14
