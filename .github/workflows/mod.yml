name: Skins mod

# Launcher Skins (docs/DECISIONS.md D-065): the core's tests and a jar for every
# loader and game version, kept as artifacts. Nothing here talks to the server.
# "Run workflow" with publish on makes the GitHub release skins-mod-v<mod/VERSION>
# with the jars and their SHA-256 sums; the launcher downloads them from there,
# pinned by those sums. A version is published once: a second run of the same
# version fails instead of replacing files players already have.

on:
  push:
    branches: [main]
    paths:
      - mod/**
      - .github/workflows/mod.yml
  pull_request:
    paths:
      - mod/**
      - .github/workflows/mod.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jars as release skins-mod-v<mod/VERSION>
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build ${{ matrix.part.name }}
    runs-on: ubuntu-24.04
    # Every Forge release is downloaded and decompiled before the build starts, so the
    # folders are split between jobs that run side by side (mod/settings.gradle, -Ponly).
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: 1.12.2 and 26.x
            only: mc-1.12.2,mc-26.3,gametest:mc-1.12.2,gametest:mc-26.3
          - name: 1.21 to 1.21.4
            only: mc-1.21.1,mc-1.21.2-1.21.4,gametest:mc-1.21.1,gametest:mc-1.21.4
          - name: 1.21.5 to 1.21.10
            only: mc-1.21.5-1.21.8,mc-1.21.9-1.21.10,gametest:mc-1.21.8,gametest:mc-1.21.10
          - name: 1.21.11
            only: mc-1.21.11,gametest:mc-1.21.11
          - name: 1.16 to 1.20.1
            only: mc-1.16.5-1.20.1,gametest:mc-1.16.5-1.20.1
          - name: 1.14.4 and 1.15.2
            only: mc-1.14.4-1.15.2,gametest:mc-1.14.4-1.15.2
          - name: 1.20.2 to 1.20.6
            only: mc-1.20.2-1.20.6,gametest:mc-1.20.2-1.20.6
          - name: the Java agents
            only: agents
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      # Java 8 builds the jar for 1.12.2, 17 those for 1.16 to 1.20.1 and 21 those
      # for 1.21.x; Gradle, Fabric Loom and RetroFuturaGradle run on 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      # ForgeGradle keeps the jars it downloads and never checks them again, and the
      # Gradle cache is saved even when a build fails: a jar cut off in transfer
      # would break every later build. Drop unreadable jars before the build, and
      # after a failed one so the saved cache is clean.
      - name: Drop damaged jars from the Forge cache
        run: &drop-damaged-jars |
          python3 - <<'EOF'
          import pathlib, zipfile
          root = pathlib.Path.home() / ".gradle/caches/minecraftforge"
          removed = 0
          for jar in root.rglob("*.jar") if root.is_dir() else []:
              try:
                  zipfile.ZipFile(jar).close()
              except (OSError, zipfile.BadZipFile):
                  jar.unlink()
                  removed += 1
          print(f"Damaged jars removed: {removed}")
          EOF
      - name: Build
        env:
          ONLY: ${{ matrix.part.only }}
        run: |
          # Setting up a Forge release downloads hundreds of files, and Forge's maven
          # now and then cuts a connection or answers 5xx for a while: one more try a minute
          # later for that, never for anything else.
          set -o pipefail
          for attempt in 1 2; do
            ./gradlew --no-daemon "-Ponly=$ONLY" build 2>&1 | tee gradle.log && exit 0
            grep -qE "Connection reset|Connection timed out|(HTTP response code:|status code) (429|5[0-9][0-9])" gradle.log || exit 1
            [ "$attempt" = 2 ] && exit 1
            echo "A download was cut off; trying once more in a minute"
            sleep 60
          done
          exit 1
      # Forge (mods.toml) reads every mod jar as a resource pack and warns at the
      # game's start when it has no pack.mcmeta.
      - name: Check that Forge jars carry pack.mcmeta
        run: |
          python3 - <<'EOF'
          import pathlib, sys, zipfile
          bad = 0
          jars = [*pathlib.Path(".").glob("**/build/libs/launcherskins-*.jar"),
                  *pathlib.Path(".").glob("gametest/**/build/libs/launchergametest-*.jar")]
          for jar in sorted(jars):
              names = set(zipfile.ZipFile(jar).namelist())
              if "META-INF/mods.toml" in names and "pack.mcmeta" not in names:
                  print(f"no pack.mcmeta: {jar.name}")
                  bad += 1
          sys.exit(1 if bad else 0)
          EOF
      - name: Drop damaged jars after a failed build
        if: failure()
        run: *drop-damaged-jars
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-skins-${{ strategy.job-index }}
          path: |
            mod/*/*/build/libs/launcherskins-*.jar
            mod/*/*/*/build/libs/launcherskins-*.jar
            !mod/**/*-sources.jar
            !mod/**/*-dev.jar
            !mod/**/*-named.jar
          retention-days: 14

  release:
    name: Publish the jars
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: launcher-skins-*
          path: artifact
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < mod/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version"; exit 1; }
          mkdir dist
          find artifact -name 'launcherskins-*.jar' -exec cp {} dist/ \;
          (cd dist && sha256sum launcherskins-*.jar > SHA256SUMS)
          echo "jars: $(ls dist/*.jar | wc -l)"
          gh release create "skins-mod-v$version" dist/* \
            --target "$GITHUB_SHA" \
            --title "Launcher Skins $version" \
            --notes "The launcher's skins mod and Java agent (docs/DECISIONS.md D-065). SHA256SUMS lists every jar's sum."
