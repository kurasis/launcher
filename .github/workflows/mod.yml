name: Skins mod

# Launcher Skins (docs/DECISIONS.md D-065): the core's tests and a jar for every
# loader and game version, kept as artifacts.
# "Run workflow" with publish on makes the GitHub release skins-mod-v<mod/VERSION>
# with the jars and their SHA-256 sums; the launcher downloads them from there,
# pinned by those sums. A version is published once: a second run of the same
# version fails instead of replacing files players already have. The release
# then goes to the beta channel's signed list on upd.lapi.sh (Skins mod list
# workflow); stable gets it after a green nightly game test.

on:
  push:
    branches: [main]
    paths:
      - mod/**
      - .github/gradle/**
      - .github/workflows/mod.yml
  pull_request:
    paths:
      - mod/**
      - .github/gradle/**
      - .github/workflows/mod.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jars as release skins-mod-v<mod/VERSION>
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build ${{ matrix.part.name }}
    runs-on: ubuntu-24.04
    # Every Forge release is downloaded and decompiled before the build starts, so the
    # folders are split between jobs that run side by side (mod/settings.gradle, -Ponly).
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: 1.12.2, 26.x and the newest snapshot
            only: mc-1.12.2,mc-26.3,mc-snapshot,gametest:mc-1.12.2,gametest:mc-26.3,gametest:mc-snapshot
          - name: 1.21 to 1.21.4
            only: mc-1.21.1,mc-1.21.2-1.21.4,gametest:mc-1.21.1,gametest:mc-1.21.4
          - name: 1.21.5 to 1.21.10
            only: mc-1.21.5-1.21.8,mc-1.21.9-1.21.10,gametest:mc-1.21.8,gametest:mc-1.21.10
          - name: 1.21.11
            only: mc-1.21.11,gametest:mc-1.21.11
          - name: 1.16 to 1.20.1
            only: mc-1.16.5-1.20.1,gametest:mc-1.16.5-1.20.1
          - name: 1.13.2 to 1.15.2
            only: mc-1.13.2,mc-1.14.4-1.15.2,gametest:mc-1.14.4-1.15.2
          - name: 1.20.2 to 1.20.6
            only: mc-1.20.2-1.20.6,gametest:mc-1.20.2-1.20.6
          - name: 1.7.10 to 1.11.2
            only: mc-1.7.10,mc-1.8.9,mc-1.9.4,mc-1.10.2,mc-1.11.2,gametest:mc-1.7.10,gametest:mc-1.8.9,gametest:mc-1.10.2
          - name: the Java agents
            only: agents
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # Java 8 builds the jars for 1.7.10 to 1.12.2, 17 those for 1.16 to 1.20.1 and 21 those
      # for 1.21.x; Gradle, Fabric Loom and RetroFuturaGradle run on 25.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # ForgeGradle keeps the jars it downloads and never checks them again, and the
      # Gradle cache is saved even when a build fails: a jar cut off in transfer
      # would break every later build. Drop unreadable jars before the build, and
      # after a failed one so the saved cache is clean.
      - name: Drop damaged jars from the Forge cache
        run: &drop-damaged-jars |
          python3 - <<'EOF'
          import pathlib, zipfile
          root = pathlib.Path.home() / ".gradle/caches/minecraftforge"
          removed = 0
          for jar in root.rglob("*.jar") if root.is_dir() else []:
              try:
                  zipfile.ZipFile(jar).close()
              except (OSError, zipfile.BadZipFile):
                  jar.unlink()
                  removed += 1
          print(f"Damaged jars removed: {removed}")
          EOF
      # Forge 1.13.2 to 1.16.4 run their JavaScript coremods in Java 8's Nashorn (ES5):
      # a newer syntax such as a trailing comma in a call stops the coremod at the game's
      # start. Compile each one there without running it.
      - name: Check that the coremods are ES5
        run: |
          cat > "$RUNNER_TEMP/compile.js" <<'EOF'
          for (var i = 0; i < arguments.length; i++) {
            try {
              var bytes = java.nio.file.Files.readAllBytes(java.nio.file.Paths.get(arguments[i]));
              new Function(String(new java.lang.String(bytes, 'UTF-8')));
            } catch (e) {
              print(arguments[i] + ': ' + e);
              exit(1);
            }
          }
          EOF
          find . -path '*/src/main/resources/*.js' -print0 |
            xargs -0 -r "$JAVA_HOME_8_X64/bin/jjs" "$RUNNER_TEMP/compile.js" --
      - name: Build
        env:
          ONLY: ${{ matrix.part.only }}
        # A build that failed on a download is tried once more through the mirror.
        run: bash ../.github/gradle/ci-build.sh
      # Forge (mods.toml) reads every mod jar as a resource pack and warns at the
      # game's start when it has no pack.mcmeta. Forge, and NeoForge before 20.4
      # (FML 1), refuse a jar whose mods.toml has a dependency without `mandatory`.
      - name: Check the Forge jars' pack.mcmeta and mods.toml
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys, zipfile
          bad = 0
          jars = [*pathlib.Path(".").glob("**/build/libs/launcherskins-*.jar"),
                  *pathlib.Path(".").glob("gametest/**/build/libs/launchergametest-*.jar")]
          for jar in sorted(jars):
              zip = zipfile.ZipFile(jar)
              names = set(zip.namelist())
              if "META-INF/mods.toml" not in names:
                  continue
              if "pack.mcmeta" not in names:
                  print(f"no pack.mcmeta: {jar.name}")
                  bad += 1
              toml = zip.read("META-INF/mods.toml").decode()
              for block in re.split(r"(?m)^\s*\[", toml):
                  if block.startswith("[dependencies.") and not re.search(r"(?m)^\s*mandatory\s*=", block):
                      print(f"a dependency without mandatory: {jar.name}")
                      bad += 1
          sys.exit(1 if bad else 0)
          EOF
      - name: Drop damaged jars after a failed build
        if: failure()
        run: *drop-damaged-jars
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launcher-skins-${{ strategy.job-index }}
          path: |
            mod/*/*/build/libs/launcherskins-*.jar
            mod/*/*/*/build/libs/launcherskins-*.jar
            !mod/**/*-sources.jar
            !mod/**/*-dev.jar
            !mod/**/*-named.jar
          retention-days: 14

  release:
    name: Publish the jars
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: launcher-skins-*
          path: artifact
      - name: Make the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < mod/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir dist
          find artifact -name 'launcherskins-*.jar' -exec cp {} dist/ \;
          (cd dist && sha256sum launcherskins-*.jar > SHA256SUMS)
          echo "jars: $(ls dist/*.jar | wc -l)"
          gh release create "skins-mod-v$version" dist/* \
            --target "$GITHUB_SHA" \
            --title "Launcher Skins $version" \
            --notes "The launcher's skins mod and Java agent (docs/DECISIONS.md D-065). SHA256SUMS lists every jar's sum."

  beta:
    name: Beta channel
    needs: release
    uses: ./.github/workflows/skins-mod-list.yml
    with:
      version: ${{ needs.release.outputs.version }}
      channels: beta
    secrets: inherit
