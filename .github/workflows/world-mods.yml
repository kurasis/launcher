name: World servers with mods

# Worlds with mods W12: a loader's server with a mod from the catalog, as the
# launcher builds a world's mods, for the releases in
# src-tauri/src/worlds/tested.json. CI runs `on_every_change` (the oldest
# and newest release of each loader and one of each kind of installer); the
# nightly run and "Run workflow" run every release of `tested`. A release is
# offered to players only once it is in `tested`, so it joins only after it
# passed here. `refused` starts worlds whose mods do not start and checks that
# the start names the mod. Logs show versions, mod names and timings only.

on:
  workflow_call:
    inputs:
      set:
        type: string
        default: on_every_change
      prebuilt:
        # CI builds the live test once for all its world servers and passes
        # it as the artifact live-server.
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      set:
        description: tested (every release) or on_every_change
        type: choice
        options: [tested, on_every_change]
        default: tested
      loader:
        description: only this loader (fabric, quilt, neoforge, forge), or all when empty
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  releases:
    name: Releases to test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        env:
          SET: ${{ inputs.set || 'tested' }}
          LOADER: ${{ inputs.loader }}
        run: |
          [[ "$SET" =~ ^(tested|on_every_change)$ ]] ||
            { echo "::error::set is tested or on_every_change"; exit 1; }
          [[ "$LOADER" =~ ^(|fabric|quilt|neoforge|forge)$ ]] ||
            { echo "::error::loader is fabric, quilt, neoforge, forge or empty"; exit 1; }
          include=$(jq -c --arg set "$SET" --arg only "$LOADER" '.[$set]
            | to_entries
            | map(select($only == "" or .key == $only) | .key as $loader
                | .value[] | {loader: $loader, minecraft: .})' \
            src-tauri/src/worlds/tested.json)
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "$(jq length <<< "$include") servers"

  build:
    # One build of the live test for every server below, unless the caller
    # built it.
    name: Build the live test
    if: ${{ !inputs.prebuilt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        timeout-minutes: 25
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: world-mods

      - name: Build
        run: |
          set -o pipefail
          binary=$(cargo test --manifest-path src-tauri/Cargo.toml --locked --test live_server \
            --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "live_server"
              and .executable != null) | .executable')
          test -x "$binary"
          mkdir -p dist
          cp "$binary" dist/live_server

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-server
          path: dist/live_server
          retention-days: 1

  server:
    name: World server ${{ matrix.loader }} ${{ matrix.minecraft }} (linux-x64)
    needs: [releases, build]
    if: >-
      ${{ !cancelled() && needs.releases.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.releases.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        timeout-minutes: 25
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-0 libxdo3 libayatana-appindicator3-1 librsvg2-2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: live-server

      - name: Install and run the world server with mods
        env:
          WORLD_VERSION: ${{ matrix.minecraft }}
          WORLD_LOADER: ${{ matrix.loader }}
        run: |
          chmod +x live_server
          ./live_server --ignored --exact host_a_world_with_mods --nocapture --test-threads=1

      - name: Update the world's mods and roll them back (A45)
        # An update tried on a copy, kept and confirmed; a broken one refused
        # on the copy, and rolled back from the world itself.
        if: matrix.loader == 'fabric' && matrix.minecraft == '1.21.1'
        env:
          WORLD_VERSION: ${{ matrix.minecraft }}
        run: ./live_server --ignored --exact update_a_world_with_mods --nocapture --test-threads=1

  refused:
    # A world whose mods do not start says which mod and why: each case is a
    # catalog release that does not start with its loader's newest stable
    # build, so a change in the loaders' words shows here.
    name: World server refusing ${{ matrix.case }} (linux-x64)
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case:
          - neoforge-range
          - fabric-minecraft
          - fabric-missing
          - forge-minecraft
          - forge-crash
          - forge-old
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        timeout-minutes: 25
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-0 libxdo3 libayatana-appindicator3-1 librsvg2-2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: live-server

      - name: Start the world and read why it did not start
        env:
          WORLD_CASE: ${{ matrix.case }}
        run: |
          chmod +x live_server
          ./live_server --ignored --exact a_world_that_does_not_start_says_why --nocapture --test-threads=1
