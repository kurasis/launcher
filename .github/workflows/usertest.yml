name: Player test

# Game versions checked the way a player meets them, on the owner's Windows test
# machines (docs/USERTEST.md; label TestPC): the newest packaged launcher from main is
# installed with its installer, and for each version, vanilla or with a mod loader, a
# player's steps are taken in its window and in the game: install, play, a new
# singleplayer world. Only by hand ("Run workflow"). A long list is cut into parts that
# run as separate jobs, so every machine with the label takes some.
#
# The runner is a real computer, so this workflow runs only for the owner's dispatch,
# never for a pull request. Inputs reach scripts only through env and are checked
# against Mojang's and the loaders' lists. No concurrency group: a runner takes one job
# at a time, and the Game test's queue (one pending run) is left alone.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: >-
          What to play, comma-separated: "26" (every 26.x release), "all" (every release,
          vanilla and with each loader), "vanilla", "fabric", "quilt", "forge", "neoforge"
          (every release that one supports), a release id (vanilla) or loader:id
        default: '26'
      label:
        description: Runner label of the test machines (several machines may share it)
        default: TestPC
      machine:
        description: >-
          Runner name the jobs must land on (on another machine a job stops before touching
          anything), or "any" for every machine with the label
        default: amd-bosgame-8gb
      part_size:
        description: Items per job (a job of 12 takes about 45 minutes)
        default: '12'
      downloads:
        description: >-
          Where the launcher downloads from (Settings, Network): automatic (the origin, our
          mirror when it fails or is very slow; what a new player has), mirror_first (the
          mirror, the origin when it fails) or origin_only
        type: choice
        options: [automatic, mirror_first, origin_only]
        default: automatic
      cleanup:
        description: Only put the machine back (stop and uninstall what an earlier, cancelled run left)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Launcher package and versions
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.versions.outputs.parts }}
      package: ${{ steps.package.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/usertest
            src/locales
      - name: Runner inputs
        env:
          LABEL: ${{ inputs.label || 'TestPC' }}
          MACHINE: ${{ inputs.machine || 'amd-bosgame-8gb' }}
        run: |
          for value in "$LABEL" "$MACHINE"; do
            [[ "$value" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::label and machine: letters, digits, . _ - only"; exit 1; }
          done
      - id: versions
        env:
          VERSIONS: ${{ inputs.versions || '26' }}
          PART_SIZE: ${{ inputs.part_size || '12' }}
          CLEANUP: ${{ inputs.cleanup && 'yes' || 'no' }}
        run: python3 scripts/usertest/plan.py
      - id: package
        name: Newest green Package run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow package.yml --branch main --event push \
            --status success --limit 1 --json databaseId,headSha,createdAt \
            --jq '.[0] | "\(.databaseId) \(.headSha) \(.createdAt)"')
          [ -n "$run" ] || { echo "::error::No green Package run on main"; exit 1; }
          read -r id sha created <<<"$run"
          echo "Package run $id, commit $sha, $created"
          echo "run=$id" >> "$GITHUB_OUTPUT"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n launcher-windows-x64 -D input/package
          ls -l input/package
          echo "Launcher: $(ls input/package/*-setup.exe | xargs -n1 basename), commit $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Interface texts
        run: |
          python3 - <<'EOF'
          import glob, json
          keys = {
              "navHome": "nav.home", "navAccount": "nav.account", "modeOffline": "accounts.modeOffline",
              "nameLabel": "accounts.nameLabel", "addProfile": "accounts.addProfile",
              "create": "instances.create", "createSubmit": "createForm.submit",
              "search": "createForm.search", "selected": "createForm.selected", "cancel": "createForm.cancel",
              "loader": "loaders.loader", "loaderFabric": "loaders.names.fabric",
              "loaderQuilt": "loaders.names.quilt", "loaderForge": "loaders.names.forge",
              "loaderNeoForge": "loaders.names.neoforge",
              "install": "install.install", "play": "install.play", "retry": "install.retry",
              "allow": "metered.allow",
          }
          texts = {k: [] for k in keys}
          for path in sorted(glob.glob("src/locales/messages/*.json")):
              ui = json.load(open(path, encoding="utf-8"))["ui"]
              for name, key in keys.items():
                  node = ui
                  for part in key.split("."):
                      node = node.get(part) if isinstance(node, dict) else None
                  if isinstance(node, str) and node not in texts[name]:
                      texts[name].append(node)
          missing = [k for k, v in texts.items() if not v]
          if missing:
              raise SystemExit(f"texts not found: {missing}")
          json.dump(texts, open("input/ui-strings.json", "w", encoding="utf-8"), ensure_ascii=False)
          EOF
          cp scripts/usertest/windows.ps1 input/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: usertest-input
          path: input
          retention-days: 3

  play:
    name: Play as a player (part ${{ matrix.part }})
    needs: prepare
    # Labels pick a runner, not a name: several machines may share the label, so the
    # first step checks that the job landed on the asked machine (unless "any").
    runs-on: [self-hosted, windows, x64, "${{ inputs.label || 'TestPC' }}"]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.parts) }}
    defaults:
      run:
        # Windows PowerShell as the runner's user runs no script files by default
        # (execution policy Restricted); lifted for these steps only.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: The asked machine
        env:
          MACHINE: ${{ inputs.machine || 'amd-bosgame-8gb' }}
        run: |
          if ($env:MACHINE -ne 'any' -and $env:RUNNER_NAME -ne $env:MACHINE) {
            Write-Host "::error::The job landed on runner $env:RUNNER_NAME, not $env:MACHINE; nothing was done. Run again, or give $env:MACHINE a label of its own."
            exit 1
          }
          Write-Host "Runner $env:RUNNER_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: usertest-input
          path: ut/input
      - name: Play
        env:
          ITEMS: ${{ matrix.items }}
          DOWNLOADS: ${{ inputs.downloads || 'automatic' }}
          CLEANUP: ${{ inputs.cleanup && 'yes' || 'no' }}
        run: |
          if ($env:CLEANUP -eq 'yes') {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ut/input/windows.ps1 -CleanupOnly
            exit $LASTEXITCODE
          }
          $setup = (Get-Item ut/input/package/*-setup.exe | Select-Object -First 1).FullName
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ut/input/windows.ps1 `
            -Setup $setup -Strings (Resolve-Path ut/input/ui-strings.json).Path `
            -Items $env:ITEMS -Downloads $env:DOWNLOADS -Out (New-Item -ItemType Directory -Force ut/out).FullName
          exit $LASTEXITCODE
      - name: Summary
        if: always()
        run: |
          $utf8 = New-Object Text.UTF8Encoding $false
          $text = "| Version | Loader | Install | Launch | World | Exit | Log errors | Note |`n| --- | --- | --- | --- | --- | --- | --- | --- |`n"
          $file = 'ut/out/results.json'
          if (Test-Path $file) {
            foreach ($r in @(Get-Content $file -Raw | ConvertFrom-Json)) {
              $i = if ($r.installSeconds) { "$($r.install) ($($r.installSeconds) s)" } else { $r.install }
              $l = if ($r.launchSeconds) { "$($r.launch) ($($r.launchSeconds) s)" } else { $r.launch }
              $w = if ($r.worldSeconds) { "$($r.world) ($($r.worldSeconds) s)" } else { $r.world }
              $e = if ($null -ne $r.exitCode) { "$($r.exit) ($($r.exitCode))" } else { $r.exit }
              $text += "| $($r.version) | $($r.loader) $($r.loaderVersion) | $i | $l | $w | $e | $($r.logErrors) | $($r.note) |`n"
            }
          }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$text`n", $utf8)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: usertest-results-${{ matrix.part }}
          path: ut/out
          retention-days: 7
          if-no-files-found: ignore
      - name: Clean the workspace
        if: always()
        run: Remove-Item -Recurse -Force ut -ErrorAction SilentlyContinue

  report:
    name: All results
    needs: [prepare, play]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/usertest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: usertest-results-*
          path: parts
      - name: One table
        env:
          PARTS: ${{ needs.prepare.outputs.parts }}
        run: python3 scripts/usertest/report.py parts report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: usertest-report
          path: report
          retention-days: 30
          if-no-files-found: ignore
