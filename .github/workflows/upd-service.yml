name: Update service

# The update tool for upd.lapi.sh (docs/DECISIONS.md D-063): tests, a release
# build of lapi-upd, and a deploy over SSH to /home/www/lapi/upd with the update
# public key (repository variable UPDATE_PUBLIC_KEY). nginx serves the updates
# as static files; publishing a launcher version is done on the server:
#   sudo -u lapi-upd /home/www/lapi/upd/current/lapi-upd publish <version>
# "Run workflow" with task=reports shows what each channel offers; task=server
# shows what the server is short of when Cloudflare cannot reach it (525, slow
# files): numbers from the server, and the newest skins mod's jars fetched
# through Cloudflare and TLS straight to the server from a runner.

on:
  push:
    branches: [main]
    paths:
      - services/upd/**
      - deploy/upd/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/upd-service.yml
      - .github/actions/**
  pull_request:
    paths:
      - services/upd/**
      # Its tests read the list of versions (D-073).
      - data/extra-versions.json
      - deploy/upd/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/upd-service.yml
      - .github/actions/**
  workflow_dispatch:
    inputs:
      task:
        description: deploy, reports for what each channel offers, or server for a check of the server
        type: choice
        options: [deploy, reports, server]
        default: deploy

permissions:
  contents: read

concurrency:
  group: upd-service-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/upd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            services/upd/target
          key: upd-${{ hashFiles('services/upd/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Ubuntu 24.04's glibc (2.39) is older than Debian 13's (2.41), so the
      # binary runs there.
      - run: cargo build --locked --release
      - name: Check the nginx files
        working-directory: ${{ github.workspace }}
        run: bash deploy/check-nginx.sh
      - name: Package the release
        run: |
          mkdir -p ../../dist-upd/nginx
          cp target/release/lapi-upd ../../dist-upd/
          cp ../../deploy/nginx/* ../../deploy/upd/nginx/* ../../dist-upd/nginx/
          tar -czf ../../lapi-upd.tar.gz -C ../../dist-upd .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lapi-upd
          path: lapi-upd.tar.gz
          retention-days: 14

  deploy:
    # One deploy of this service at a time, from any branch or run.
    concurrency:
      group: upd-deploy
      cancel-in-progress: false
    name: Deploy to upd.lapi.sh
    # Deploys use the production environment: Settings → Environments →
    # production → Required reviewers makes each one wait for an approval.
    environment: production
    needs: test
    # Only main reaches production, also when run by hand.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.task == 'deploy'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lapi-upd
      - uses: ./.github/actions/lapi-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/lapi-upload
        with:
          service: upd
          target: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          # Checked here too: it becomes part of a command the server's shell reads.
          if [ -n "$UPDATE_PUBLIC_KEY" ] && ! [[ "$UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/=]{40,400}$ ]]; then
            echo "::error::UPDATE_PUBLIC_KEY is not a base64 key"; exit 1
          fi
          set +e
          ssh "$TARGET" \
            "bash ~/.lapi-bootstrap/$SETUP/deploy.sh upd $RELEASE $ARCHIVE $UPDATE_PUBLIC_KEY" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if grep -q NOT_BOOTSTRAPPED deploy.log; then
            echo "::warning::The server is not set up yet: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it once, then re-run this workflow."
            exit 0
          fi
          if grep -q NO_UPDATE_KEY deploy.log; then
            echo "::warning::No update public key: set the repository variable UPDATE_PUBLIC_KEY and deploy again."
          fi
          if grep -qE 'NGINX_(PENDING|CHANGED)' deploy.log; then
            echo "::warning::The nginx files on the server are not these: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it to apply them."
          fi
          exit "$status"
      - uses: ./.github/actions/lapi-check
        with:
          service: upd
          ssh-host: ${{ secrets.SSH_HOST }}
          health: /v1/stable/windows-x86_64-nsis.json
          status-only: 'true'

  reports:
    name: Channels
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'reports'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lapi-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Status
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### Update channels'
            echo '```'
            ssh "$TARGET" \
              'sudo -n -u lapi-upd /home/www/lapi/upd/current/lapi-upd status'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  server:
    name: Server check
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'server'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lapi-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: The server
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### The server, before'
            echo '```'
            ssh "$TARGET" bash -s < scripts/server-check.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Files through Cloudflare
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest skins mod's jars, each past Cloudflare's cache (a query
          # of its own) so every one is a request to the server, three at a
          # time (more trips upd.lapi.sh's limit of 10 a second: 429). One
          # line per request: data centre (the part of cf-ray after the dash,
          # like IAD), status, bytes received of the file's size, seconds.
          tag=$(gh release list --limit 50 --json tagName \
            -q '[.[] | select(.tagName | startswith("skins-mod-v"))][0].tagName')
          version=${tag#skins-mod-v}
          gh release download "$tag" --pattern SHA256SUMS
          awk '{ sub(/^\*/, "", $2) } $2 ~ /^launcherskins-[a-z0-9.-]+\.jar$/ { print $2 }' SHA256SUMS > names
          export version
          fetch() {
            out=$(curl -sS -o /dev/null --max-time 20 \
              -w '%{http_code} %{size_download} %{time_total} %header{cf-ray} %header{content-length}' \
              "https://upd.lapi.sh/skins-mod/$version/$1?check=$GITHUB_RUN_ID" 2>/dev/null)
            read -r code bytes secs ray length <<< "$out"
            echo "${ray##*-} ${code:-000} ${bytes:-0} of ${length:-?} ${secs:-20}"
          }
          export -f fetch
          xargs -P 3 -I{} bash -c 'fetch {}' < names | sort > answers
          {
            echo "### Skins mod $version through Cloudflare: $(wc -l < answers) requests"
            echo '```'
            echo "data centre, status: requests"
            awk '{ print $1 ", " $2 }' answers | sort | uniq -c
            awk '{ t += $NF; if ($NF > m) m = $NF } END { printf "seconds: average %.2f, longest %.2f\n", t / NR, m }' answers
            echo "not whole (data centre, status, bytes of size, seconds):"
            awk '$3 != $5' answers | head -40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: TLS straight to the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # Only handshakes: the server answers nothing around Cloudflare.
          ip=$(getent ahostsv4 "$SSH_HOST" | awk 'NR == 1 { print $1 }')
          [ -n "$ip" ] && echo "::add-mask::$ip"
          ok=0 failed=0 slow=0
          for _ in $(seq 1 40); do
            start=$(date +%s%N)
            if echo | timeout 10 openssl s_client -connect "$ip:443" -servername upd.lapi.sh >/dev/null 2>&1; then
              ok=$((ok + 1))
              [ $(( ($(date +%s%N) - start) / 1000000 )) -gt 1000 ] && slow=$((slow + 1))
            else
              failed=$((failed + 1))
            fi
          done
          {
            echo '### TLS straight to the server'
            echo "handshakes: $ok of 40 ok, $failed failed, $slow over a second"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The server, after
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### The server, after'
            echo '```'
            ssh "$TARGET" bash -s < scripts/server-check.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
