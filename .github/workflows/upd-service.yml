name: Update service

# The update tool for upd.lapi.sh (docs/DECISIONS.md D-063): tests, a release
# build of lapi-upd, and a deploy over SSH to /home/www/lapi/upd with the update
# public key (repository variable UPDATE_PUBLIC_KEY). nginx serves the updates
# as static files; publishing a launcher version is done on the server:
#   sudo -u lapi-upd /home/www/lapi/upd/current/lapi-upd publish <version>
# "Run workflow" with task=reports shows what each channel offers.

on:
  push:
    branches: [main, claude/launcher-updates]
    paths:
      - services/upd/**
      - deploy/upd/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/upd-service.yml
  pull_request:
    paths:
      - services/upd/**
      - deploy/upd/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/upd-service.yml
  workflow_dispatch:
    inputs:
      task:
        description: deploy, or reports for what each channel offers
        type: choice
        options: [deploy, reports]
        default: deploy

permissions:
  contents: read

concurrency:
  group: upd-service-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/upd
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            services/upd/target
          key: upd-${{ hashFiles('services/upd/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Ubuntu 24.04's glibc (2.39) is older than Debian 13's (2.41), so the
      # binary runs there.
      - run: cargo build --locked --release
      - name: Check the nginx files
        working-directory: ${{ github.workspace }}
        run: bash deploy/check-nginx.sh
      - name: Package the release
        run: |
          mkdir -p ../../dist-upd/nginx
          cp target/release/lapi-upd ../../dist-upd/
          cp ../../deploy/nginx/* ../../deploy/upd/nginx/* ../../dist-upd/nginx/
          tar -czf ../../lapi-upd.tar.gz -C ../../dist-upd .
      - uses: actions/upload-artifact@v4
        with:
          name: lapi-upd
          path: lapi-upd.tar.gz
          retention-days: 14

  deploy:
    name: Deploy to upd.lapi.sh
    needs: test
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/launcher-updates'))
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'deploy')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lapi-upd
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          release=$(git rev-parse --short=12 HEAD)
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes lapi-upd.tar.gz "$TARGET:/tmp/lapi-upd-$release.tar.gz"
          # deploy/ goes to a folder of its own per run (two workflows may
          # deploy at once); ~/lapi-bootstrap points at the newest, for the
          # root step: sudo bash ~/lapi-bootstrap/bootstrap.sh <user>
          setup="$GITHUB_RUN_ID-$GITHUB_JOB-upd"
          echo "SETUP=$setup" >> "$GITHUB_ENV"
          tar -cz deploy | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" "set -e
            d=\$HOME/.lapi-bootstrap/$setup
            rm -rf \"\$d\" && mkdir -p \"\$d\" && tar -xz -C \"\$d\" --strip-components=1
            if [ -d ~/lapi-bootstrap ] && [ ! -L ~/lapi-bootstrap ]; then rm -rf ~/lapi-bootstrap; fi
            ln -sfn \"\$d\" ~/lapi-bootstrap.$setup && mv -T ~/lapi-bootstrap.$setup ~/lapi-bootstrap
            ls -1dt ~/.lapi-bootstrap/* | tail -n +11 | xargs -r rm -rf"
      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          set +e
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" \
            "bash ~/.lapi-bootstrap/$SETUP/deploy.sh upd $RELEASE /tmp/lapi-upd-$RELEASE.tar.gz $UPDATE_PUBLIC_KEY" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if grep -q NOT_BOOTSTRAPPED deploy.log; then
            echo "::warning::The server is not set up yet: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it once, then re-run this workflow."
            exit 0
          fi
          if grep -q NO_UPDATE_KEY deploy.log; then
            echo "::warning::No update public key: set the repository variable UPDATE_PUBLIC_KEY and deploy again."
          fi
          if grep -qE 'NGINX_(PENDING|CHANGED)' deploy.log; then
            echo "::warning::The nginx files on the server are not these: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it to apply them."
          fi
          exit "$status"
      - name: Check from outside
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://upd.lapi.sh/v1/stable/windows-x86_64-nsis.json || true)
            if [ "$code" = 200 ] || [ "$code" = 204 ]; then echo "manifest answers $code"; exit 0; fi
            sleep 5
          done
          echo "::warning::https://upd.lapi.sh does not answer through Cloudflare yet"
      - name: The origin answers only through Cloudflare
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ip=$(getent ahostsv4 "$SSH_HOST" | awk 'NR==1 {print $1}')
          if curl -sk --max-time 10 -o /dev/null --resolve "upd.lapi.sh:443:$ip" https://upd.lapi.sh/download/; then
            echo "::warning::The server answers upd.lapi.sh directly, around Cloudflare: apply the nginx files with bootstrap.sh."
          else
            echo "Direct requests to the server are refused."
          fi

  reports:
    name: Channels
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'reports'
    runs-on: ubuntu-24.04
    steps:
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Status
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### Update channels'
            echo '```'
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" \
              'sudo -n -u lapi-upd /home/www/lapi/upd/current/lapi-upd status'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
