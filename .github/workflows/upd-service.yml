name: Update service

# The update tool for upd.lapi.sh (docs/DECISIONS.md D-063): tests, a release
# build of lapi-upd, and a deploy over SSH to /home/www/lapi/upd with the update
# public key (repository variable UPDATE_PUBLIC_KEY). nginx serves the updates
# as static files; publishing a launcher version is done on the server:
#   sudo -u lapi-upd /home/www/lapi/upd/current/lapi-upd publish <version>
# "Run workflow" with task=reports shows what each channel offers.

on:
  push:
    branches: [main]
    paths:
      - services/upd/**
      - deploy/upd/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/upd-service.yml
      - .github/actions/**
  pull_request:
    paths:
      - services/upd/**
      - deploy/upd/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/upd-service.yml
      - .github/actions/**
  workflow_dispatch:
    inputs:
      task:
        description: deploy, or reports for what each channel offers
        type: choice
        options: [deploy, reports]
        default: deploy

permissions:
  contents: read

concurrency:
  group: upd-service-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/upd
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            services/upd/target
          key: upd-${{ hashFiles('services/upd/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Ubuntu 24.04's glibc (2.39) is older than Debian 13's (2.41), so the
      # binary runs there.
      - run: cargo build --locked --release
      - name: Check the nginx files
        working-directory: ${{ github.workspace }}
        run: bash deploy/check-nginx.sh
      - name: Package the release
        run: |
          mkdir -p ../../dist-upd/nginx
          cp target/release/lapi-upd ../../dist-upd/
          cp ../../deploy/nginx/* ../../deploy/upd/nginx/* ../../dist-upd/nginx/
          tar -czf ../../lapi-upd.tar.gz -C ../../dist-upd .
      - uses: actions/upload-artifact@v4
        with:
          name: lapi-upd
          path: lapi-upd.tar.gz
          retention-days: 14

  deploy:
    # One deploy of this service at a time, from any branch or run.
    concurrency:
      group: upd-deploy
      cancel-in-progress: false
    name: Deploy to upd.lapi.sh
    # Deploys use the production environment: Settings → Environments →
    # production → Required reviewers makes each one wait for an approval.
    environment: production
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'deploy')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lapi-upd
      - uses: ./.github/actions/lapi-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/lapi-upload
        with:
          service: upd
          target: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          # Checked here too: it becomes part of a command the server's shell reads.
          if [ -n "$UPDATE_PUBLIC_KEY" ] && ! [[ "$UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/=]{40,400}$ ]]; then
            echo "::error::UPDATE_PUBLIC_KEY is not a base64 key"; exit 1
          fi
          set +e
          ssh "$TARGET" \
            "bash ~/.lapi-bootstrap/$SETUP/deploy.sh upd $RELEASE $ARCHIVE $UPDATE_PUBLIC_KEY" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if grep -q NOT_BOOTSTRAPPED deploy.log; then
            echo "::warning::The server is not set up yet: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it once, then re-run this workflow."
            exit 0
          fi
          if grep -q NO_UPDATE_KEY deploy.log; then
            echo "::warning::No update public key: set the repository variable UPDATE_PUBLIC_KEY and deploy again."
          fi
          if grep -qE 'NGINX_(PENDING|CHANGED)' deploy.log; then
            echo "::warning::The nginx files on the server are not these: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it to apply them."
          fi
          exit "$status"
      - uses: ./.github/actions/lapi-check
        with:
          service: upd
          ssh-host: ${{ secrets.SSH_HOST }}
          health: /v1/stable/windows-x86_64-nsis.json
          status-only: 'true'

  reports:
    name: Channels
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'reports'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lapi-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Status
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### Update channels'
            echo '```'
            ssh "$TARGET" \
              'sudo -n -u lapi-upd /home/www/lapi/upd/current/lapi-upd status'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
