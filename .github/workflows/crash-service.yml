name: Crash service

# The crash report service at crash.lapi.sh (docs/DECISIONS.md D-061): tests,
# a release build, and a deploy over SSH to /home/www/lapi/crash. The server
# needs deploy/crash/bootstrap.sh run once as root; until then the deploy step
# uploads that script and stops with a warning. "Run workflow" with
# task=reports prints the report groups of the last 30 days.

on:
  push:
    branches: [main, claude/crash-reports]
    paths:
      - services/crash/**
      - deploy/crash/**
      - .github/workflows/crash-service.yml
  pull_request:
    paths:
      - services/crash/**
      - deploy/crash/**
      - .github/workflows/crash-service.yml
  workflow_dispatch:
    inputs:
      task:
        description: deploy, or reports to list report groups
        type: choice
        options: [deploy, reports]
        default: deploy

permissions:
  contents: read

concurrency:
  group: crash-service-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/crash
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            services/crash/target
          key: crash-${{ hashFiles('services/crash/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Ubuntu 24.04's glibc (2.39) is older than Debian 13's (2.41), so the
      # binary runs there.
      - run: cargo build --locked --release
      - name: Package the release
        run: |
          mkdir -p ../../dist-crash/nginx
          cp target/release/lapi-crash ../../dist-crash/
          cp ../../deploy/crash/nginx/* ../../dist-crash/nginx/
          tar -czf ../../lapi-crash.tar.gz -C ../../dist-crash .
      - uses: actions/upload-artifact@v4
        with:
          name: lapi-crash
          path: lapi-crash.tar.gz
          retention-days: 14

  deploy:
    name: Deploy to crash.lapi.sh
    needs: test
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/crash-reports'))
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'deploy')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lapi-crash
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          release=$(git rev-parse --short=12 HEAD)
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes lapi-crash.tar.gz "$TARGET:/tmp/lapi-crash-$release.tar.gz"
          # The setup files stay in the deploy user's home for the one-time
          # root step: sudo bash ~/lapi-bootstrap/bootstrap.sh <user>
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" 'mkdir -p ~/lapi-bootstrap'
          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/crash/bootstrap.sh deploy/crash/deploy.sh \
            deploy/crash/lapi-crash.service "$TARGET:lapi-bootstrap/"
      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set +e
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" \
            "bash ~/lapi-bootstrap/deploy.sh $RELEASE /tmp/lapi-crash-$RELEASE.tar.gz" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if grep -q NOT_BOOTSTRAPPED deploy.log; then
            echo "::warning::The server is not set up yet: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it once, then re-run this workflow."
            exit 0
          fi
          exit "$status"
      - name: Check from outside
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://crash.lapi.sh/v1/health; then echo; exit 0; fi
            sleep 5
          done
          echo "::warning::https://crash.lapi.sh/v1/health does not answer through Cloudflare yet"

  reports:
    name: Report groups
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'reports'
    runs-on: ubuntu-24.04
    steps:
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Groups of the last 30 days
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### Crash report groups, last 30 days'
            echo '```'
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" \
              'sudo -n -u lapi-crash /home/www/lapi/crash/current/lapi-crash groups --days 30'
            echo '```'
            echo '### Statistics and feedback'
            echo '```json'
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" \
              'sudo -n -u lapi-crash /home/www/lapi/crash/current/lapi-crash stats --days 30'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
