name: Crash service

# The crash report service at crash.lapi.sh (docs/DECISIONS.md D-061): tests,
# a release build, and a deploy over SSH to /home/www/lapi/crash. The server
# needs deploy/bootstrap.sh run as root once, and again when the nginx files
# change (the deploy warns); the deploy uploads deploy/ to ~/lapi-bootstrap.
#
# This repository is public, and so are its workflow logs: nothing a player
# sent and nothing about the server is printed here. "Run workflow" with
# task=reports shows counts per cause only; reports are read on the server
# (docs/CRASH-REPORTS.md).

on:
  push:
    branches: [main, claude/launcher-updates]
    paths:
      - services/crash/**
      - deploy/crash/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/crash-service.yml
  pull_request:
    paths:
      - services/crash/**
      - deploy/crash/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/crash-service.yml
  workflow_dispatch:
    inputs:
      task:
        description: deploy, or reports to list report groups
        type: choice
        options: [deploy, reports]
        default: deploy

permissions:
  contents: read

concurrency:
  group: crash-service-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/crash
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            services/crash/target
          key: crash-${{ hashFiles('services/crash/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Ubuntu 24.04's glibc (2.39) is older than Debian 13's (2.41), so the
      # binary runs there.
      - run: cargo build --locked --release
      - name: Check the nginx files
        working-directory: ${{ github.workspace }}
        run: bash deploy/check-nginx.sh
      - name: Package the release
        run: |
          mkdir -p ../../dist-crash/nginx
          cp target/release/lapi-crash ../../dist-crash/
          cp ../../deploy/nginx/* ../../deploy/crash/nginx/* ../../dist-crash/nginx/
          tar -czf ../../lapi-crash.tar.gz -C ../../dist-crash .
      - uses: actions/upload-artifact@v4
        with:
          name: lapi-crash
          path: lapi-crash.tar.gz
          retention-days: 14

  deploy:
    name: Deploy to crash.lapi.sh
    needs: test
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/launcher-updates'))
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'deploy')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lapi-crash
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          release=$(git rev-parse --short=12 HEAD)
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes lapi-crash.tar.gz "$TARGET:/tmp/lapi-crash-$release.tar.gz"
          # deploy/ goes to a folder of its own per run (two workflows may
          # deploy at once); ~/lapi-bootstrap points at the newest, for the
          # root step: sudo bash ~/lapi-bootstrap/bootstrap.sh <user>
          setup="$GITHUB_RUN_ID-$GITHUB_JOB-crash"
          echo "SETUP=$setup" >> "$GITHUB_ENV"
          tar -cz deploy | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" "set -e
            d=\$HOME/.lapi-bootstrap/$setup
            rm -rf \"\$d\" && mkdir -p \"\$d\" && tar -xz -C \"\$d\" --strip-components=1
            if [ -d ~/lapi-bootstrap ] && [ ! -L ~/lapi-bootstrap ]; then rm -rf ~/lapi-bootstrap; fi
            ln -sfn \"\$d\" ~/lapi-bootstrap.$setup && mv -T ~/lapi-bootstrap.$setup ~/lapi-bootstrap
            ls -1dt ~/.lapi-bootstrap/* | tail -n +11 | xargs -r rm -rf"
      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set +e
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" \
            "bash ~/.lapi-bootstrap/$SETUP/deploy.sh crash $RELEASE /tmp/lapi-crash-$RELEASE.tar.gz" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if grep -q NOT_BOOTSTRAPPED deploy.log; then
            echo "::warning::The server is not set up yet: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it once, then re-run this workflow."
            exit 0
          fi
          if grep -qE 'NGINX_(PENDING|CHANGED)' deploy.log; then
            echo "::warning::The nginx files on the server are not these: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it to apply them."
          fi
          exit "$status"
      - name: Check from outside
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://crash.lapi.sh/v1/health; then echo; exit 0; fi
            sleep 5
          done
          echo "::warning::https://crash.lapi.sh/v1/health does not answer through Cloudflare yet"
      - name: The origin answers only through Cloudflare
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ip=$(getent ahostsv4 "$SSH_HOST" | awk 'NR==1 {print $1}')
          if curl -sk --max-time 10 -o /dev/null --resolve "crash.lapi.sh:443:$ip" https://crash.lapi.sh/v1/health; then
            echo "::warning::The server answers crash.lapi.sh directly, around Cloudflare: apply the nginx files with bootstrap.sh."
          else
            echo "Direct requests to the server are refused."
          fi

  reports:
    name: Counts per cause
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'reports'
    runs-on: ubuntu-24.04
    steps:
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # `overview` prints counts per cause and launcher version only: the logs
      # of this public repository must not hold signatures, notes or files.
      - name: The last 30 days
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### Crash reports, statistics and answers, last 30 days'
            echo 'Counts only. Read the reports themselves on the server: docs/CRASH-REPORTS.md.'
            echo '```json'
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" \
              'sudo -n -u lapi-crash /home/www/lapi/crash/current/lapi-crash overview --days 30'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
