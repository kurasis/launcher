name: Crash service

on:
  push:
    branches: [main, claude/crash-reports]
    paths:
      - services/crash/**
      - deploy/crash/**
      - .github/workflows/crash-service.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crash-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect the server (read-only)
    runs-on: ubuntu-24.04
    steps:
      - name: How the public sees crash.lapi.sh
        run: |
          curl -sS -o /dev/null -w 'https %{http_code} %{remote_ip}\n' --max-time 15 https://crash.lapi.sh/ || true
          curl -sS -I --max-time 15 http://crash.lapi.sh/ | head -5 || true
          curl -sS --max-time 15 https://crash.lapi.sh/cdn-cgi/trace | grep -E '^(h|ip|colo|tls|http)=' || true
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Describe the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "== nginx: $(/usr/sbin/nginx -v 2>&1)"; dpkg-query -W -f='${Package} ${Version} ${Maintainer}\n' 'nginx*' 2>/dev/null
          systemctl is-enabled nginx 2>&1; systemctl status nginx --no-pager 2>&1 | head -5
          echo "== nginx.conf includes"; grep -nE 'include|user ' /etc/nginx/nginx.conf
          echo "== default.conf"; grep -vE '^\s*#|^\s*$' /etc/nginx/conf.d/default.conf
          echo "== linger: $(loginctl show-user "$(whoami)" -p Linger 2>&1)"
          echo "== user systemd: $(systemctl --user is-system-running 2>&1)"
          echo "== home: $HOME $(stat -c '%U %a' "$HOME")"
          echo "== can write /home/www/lapi/crash: $(test -w /home/www/lapi/crash && echo yes || echo no)"
          echo "== sudo -l"; sudo -n -l 2>&1 | head -5
          echo "== apt sources"; grep -rhE '^deb|^URIs' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | head
          echo "== firewall"; command -v nft iptables 2>/dev/null
          REMOTE
