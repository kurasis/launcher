name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        # macOS is off until the owner turns it back on (2026-10-20): Mac
        # runners are slow and scarce. A manual run can still ask for it.
        description: Also build and check macOS
        type: boolean
        default: false
      windows_arm:
        # Windows on ARM is off until the owner turns it back on (2026-10-20).
        # A manual run can still ask for it.
        description: Also build and check Windows on ARM
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  rust:
    name: Rust core (${{ matrix.name }})
    strategy:
      fail-fast: false
      # macOS and Windows on ARM only on a manual run that asks for them (the
      # macos and windows_arm inputs).
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}{1}{2}]',
          '{"name": "linux-x64", "os": "ubuntu-24.04"},
          {"name": "windows-x64", "os": "windows-2025"}',
          inputs.windows_arm
          && ', {"name": "windows-arm64", "os": "windows-11-arm"}'
          || '',
          inputs.macos
          && ', {"name": "macos-arm64", "os": "macos-15"}, {"name": "macos-x64", "os": "macos-15-intel"}'
          || '')) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install rustup (Windows on ARM images may lack it)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: rustfmt
        if: runner.os == 'Linux'
        run: npm run rust:fmt

      - name: clippy
        run: npm run rust:lint

      - name: cargo test
        run: npm run rust:test

      # No release build here: the Package workflow builds and smoke-tests the
      # same release on every target, so a second one only doubled the slowest
      # step and held runners other pull requests wait for (D-007).

  world-server:
    # Worlds with Friends W3, A8: Mojang's server of each release below,
    # installed through the launcher's verified downloads and run in offline
    # mode on loopback. The test prints fixed words and numbers only.
    name: World server ${{ matrix.minecraft }} (linux-x64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Releases where the server, its Java, Log4j or the Login Start
        # changed; protocol empty for the newest release and snapshot,
        # whatever they are.
        include:
          - { minecraft: '1.7.10', protocol: '5' }
          - { minecraft: '1.12.2', protocol: '340' }
          - { minecraft: '1.16.5', protocol: '754' }
          - { minecraft: '1.18.2', protocol: '758' }
          - { minecraft: '1.19.2', protocol: '760' }
          - { minecraft: '1.20.1', protocol: '763' }
          - { minecraft: '1.21.1', protocol: '767' }
          - { minecraft: 'latest', protocol: '' }
          - { minecraft: 'snapshot', protocol: '' }
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install and run the world server
        env:
          WORLD_VERSION: ${{ matrix.minecraft }}
          WORLD_PROTOCOL: ${{ matrix.protocol }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test live_server
          -- --ignored --exact host_a_world --nocapture --test-threads=1

  world-server-mods:
    # Worlds with mods W12: a loader's server with Fabric API and Sodium from
    # the catalog (Quilt runs the same Fabric mods; NeoForge JEI and Sodium),
    # as the launcher builds a world's mods. A loader and release
    # are offered to players only once they pass here (worlds/pack.rs TESTED).
    name: World server ${{ matrix.loader }} ${{ matrix.minecraft }} (linux-x64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: 'fabric', minecraft: '1.20.1' }
          - { loader: 'fabric', minecraft: '1.21.1' }
          - { loader: 'fabric', minecraft: '26.3' }
          - { loader: 'quilt', minecraft: '1.20.1' }
          - { loader: 'quilt', minecraft: '1.21.1' }
          - { loader: 'quilt', minecraft: '26.3' }
          - { loader: 'neoforge', minecraft: '1.21.1' }
          - { loader: 'neoforge', minecraft: '26.3' }
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install and run the world server with mods
        env:
          WORLD_VERSION: ${{ matrix.minecraft }}
          WORLD_LOADER: ${{ matrix.loader }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test live_server
          -- --ignored --exact host_a_world_with_mods --nocapture --test-threads=1

      - name: Update the world's mods and roll them back (A45)
        # An update tried on a copy, kept and confirmed; a broken one refused
        # on the copy, and rolled back from the world itself.
        if: matrix.loader == 'fabric' && matrix.minecraft == '1.21.1'
        env:
          WORLD_VERSION: ${{ matrix.minecraft }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test live_server
          -- --ignored --exact update_a_world_with_mods --nocapture --test-threads=1

  world-servers:
    # One result for every version above, under the check's earlier name.
    name: World server (linux-x64)
    needs: [world-server, world-server-mods]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every world server ran
        run: >-
          test "${{ needs.world-server.result }}" = success &&
          test "${{ needs.world-server-mods.result }}" = success
