name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        # macOS is off until the owner turns it back on (2026-10-20): Mac
        # runners are slow and scarce. A manual run can still ask for it.
        description: Also build and check macOS
        type: boolean
        default: false
      windows_arm:
        # Windows on ARM is off until the owner turns it back on (2026-10-20).
        # A manual run can still ask for it.
        description: Also build and check Windows on ARM
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  legacy-tweaker:
    # The launcher's tweaker for games before 1.6 (java/legacy-tweaker): the
    # committed jar is what its source builds to, and it sets the game folder
    # before a game's thread reads it.
    name: Legacy tweaker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: The jar matches its source
        run: |
          java/legacy-tweaker/build.sh
          git diff --exit-code -- java/legacy-tweaker/legacy-tweaker.jar
          test -z "$(git status --porcelain --ignored -- java/legacy-tweaker/legacy-tweaker.jar)"
      - name: The game folder is set before the game starts
        run: JAVA8="$JAVA_HOME_8_X64" java/legacy-tweaker/check.sh

  rust:
    name: Rust core (${{ matrix.name }})
    strategy:
      fail-fast: false
      # macOS and Windows on ARM only on a manual run that asks for them (the
      # macos and windows_arm inputs).
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}{1}{2}]',
          '{"name": "linux-x64", "os": "ubuntu-24.04"},
          {"name": "windows-x64", "os": "windows-2025"}',
          inputs.windows_arm
          && ', {"name": "windows-arm64", "os": "windows-11-arm"}'
          || '',
          inputs.macos
          && ', {"name": "macos-arm64", "os": "macos-15"}, {"name": "macos-x64", "os": "macos-15-intel"}'
          || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install rustup (Windows on ARM images may lack it)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            crates/mod-meta

      - run: npm ci

      - name: rustfmt
        if: runner.os == 'Linux'
        run: npm run rust:fmt

      - name: clippy
        run: npm run rust:lint

      - name: cargo test
        run: npm run rust:test

      # No release build here: the Package workflow builds and smoke-tests the
      # same release on every target, so a second one only doubled the slowest
      # step and held runners other pull requests wait for (D-007).

  changes:
    # The world servers below take most of CI's runners: a pull request runs
    # them only when it changes the worlds' code (worlds/, tunnel/), their
    # live test or world-mods.yml (owner request). Pushes to main, manual runs
    # and the nightly run try them all, so anything else they use is still
    # tried before long.
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      worlds: ${{ steps.diff.outputs.worlds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request is checked out as its merge into the base branch;
          # the merge's first parent is the base.
          fetch-depth: 2

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "worlds=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(src-tauri/src/(worlds|tunnel)/|src-tauri/tests/live_server\.rs$|\.github/workflows/world-mods\.yml$)' <<< "$changed"; then
            echo "worlds=true" >> "$GITHUB_OUTPUT"
            echo "The worlds changed: world servers run"
          else
            echo "worlds=false" >> "$GITHUB_OUTPUT"
            echo "The worlds did not change: no world servers"
          fi

  live-test:
    # One build of the live test for every world server below, with and
    # without mods.
    name: Build the live test
    needs: changes
    if: needs.changes.outputs.worlds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        timeout-minutes: 25
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: world-mods

      - name: Build
        run: |
          set -o pipefail
          binary=$(cargo test --manifest-path src-tauri/Cargo.toml --locked --test live_server \
            --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "live_server"
              and .executable != null) | .executable')
          test -x "$binary"
          mkdir -p dist
          cp "$binary" dist/live_server

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-server
          path: dist/live_server
          retention-days: 1

  world-server:
    # Worlds with Friends W3, A8: Mojang's server of each release below,
    # installed through the launcher's verified downloads and run in offline
    # mode on loopback. The test prints fixed words and numbers only.
    name: World server ${{ matrix.minecraft }} (linux-x64)
    needs: [changes, live-test]
    if: needs.changes.outputs.worlds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Releases where the server, its Java, Log4j or the Login Start
        # changed; protocol empty for the newest release and snapshot,
        # whatever they are.
        include:
          - { minecraft: '1.7.10', protocol: '5' }
          - { minecraft: '1.12.2', protocol: '340' }
          - { minecraft: '1.16.5', protocol: '754' }
          - { minecraft: '1.18.2', protocol: '758' }
          - { minecraft: '1.19.2', protocol: '760' }
          - { minecraft: '1.20.1', protocol: '763' }
          - { minecraft: '1.21.1', protocol: '767' }
          - { minecraft: 'latest', protocol: '' }
          - { minecraft: 'snapshot', protocol: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        timeout-minutes: 25
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-0 libxdo3 libayatana-appindicator3-1 librsvg2-2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: live-server

      - name: Install and run the world server
        env:
          WORLD_VERSION: ${{ matrix.minecraft }}
          WORLD_PROTOCOL: ${{ matrix.protocol }}
        run: |
          chmod +x live_server
          ./live_server --ignored --exact host_a_world --nocapture --test-threads=1

  world-server-mods:
    # Worlds with mods W12: the releases of src-tauri/src/worlds/tested.json
    # that every change tries (world-mods.yml; the nightly run tries all),
    # with the live test built above.
    name: World servers with mods
    needs: [changes, live-test]
    if: needs.changes.outputs.worlds == 'true'
    uses: ./.github/workflows/world-mods.yml
    with:
      set: on_every_change
      prebuilt: true

  world-servers:
    # One result for every version above, under the check's earlier name.
    # Passes without them when the worlds did not change.
    name: World server (linux-x64)
    needs: [changes, world-server, world-server-mods]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every world server ran
        env:
          CHANGES: ${{ needs.changes.result }}
          WORLDS: ${{ needs.changes.outputs.worlds }}
          VANILLA: ${{ needs.world-server.result }}
          MODS: ${{ needs.world-server-mods.result }}
        run: |
          test "$CHANGES" = success
          if [ "$WORLDS" != true ]; then
            echo "The worlds did not change: no world servers needed"
            exit 0
          fi
          test "$VANILLA" = success && test "$MODS" = success
