name: Game test

# The game played by the test bot on the owner's Windows test machine
# (docs/GAMETEST.md): a self-hosted runner labelled `gametest` installs each
# scenario through the launcher, adds the bot, this commit's skins mod and
# optionally a medium set of popular mods, serves test skins (HD, slim,
# animated, capes) and lets the bot play for the given minutes.
#
# The runner is a real computer, so this workflow runs only from main: by hand
# ("Run workflow") or on the nightly schedule, never for a pull request. Inputs
# reach scripts only through env and are checked against fixed lists.
#
# The medium set plays the mod versions locked in
# src-tauri/tests/gametest/medium.lock.json. The nightly run then plays the
# medium scenarios again with each mod's newest version: a failure there is
# another mod's news and holds nothing, and a set that passes is committed to
# the lock for the next runs (docs/GAMETEST.md).
#
# A green nightly run gives the skins mod release of this commit (mod/VERSION,
# already on the beta channel) to the stable channel's signed list on
# upd.lapi.sh (docs/DECISIONS.md D-065), when the mod's code is the release's.
# Only our own failures turn a run red: a crash blamed on another mod, or a
# download that failed, is a warning.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: Game versions (comma-separated; 26.3, 1.21.11, 1.21.10, 1.21.8, 1.21.4, 1.21.1, 1.20.6, 1.20.4, 1.20.1, 1.19.4, 1.19.2, 1.18.2, 1.17.1, 1.16.5, 1.15.2, 1.14.4, 1.12.2, 1.8.9, 1.7.10)
        default: 26.3,1.21.11,1.21.1,1.20.1,1.12.2
      loaders:
        description: Loaders (comma-separated; vanilla, fabric, quilt, neoforge, forge)
        default: vanilla,fabric,quilt,neoforge,forge
      mods:
        description: Mod sets (comma-separated; none, medium)
        default: none,medium
      minutes:
        description: Minutes of play per scenario (0.5 to 60)
        default: '5'
      skin:
        description: Skin variant for every scenario, or rotate (classic, slim128, hd256, hd512, anim64, anim256, animcape, legacy256, cape, none)
        default: rotate
      promote:
        description: After a green run, give this commit's skins mod release to the stable channel (the nightly run does)
        type: boolean
        default: false
      newest:
        description: Then play the medium scenarios with the newest mods and lock the sets that pass (the nightly run does)
        type: boolean
        default: false
  schedule:
    # 03:00 Moscow time.
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: gametest
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the scenarios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.plan.outputs.scenarios }}
      newest: ${{ steps.plan.outputs.newest }}
      folders: ${{ steps.plan.outputs.folders }}
      minutes: ${{ steps.plan.outputs.minutes }}
    steps:
      - id: plan
        env:
          VERSIONS: ${{ inputs.versions || '26.3,1.21.11,1.21.1,1.20.1,1.12.2' }}
          LOADERS: ${{ inputs.loaders || 'vanilla,fabric,quilt,neoforge,forge' }}
          MODS: ${{ inputs.mods || 'none,medium' }}
          MINUTES: ${{ inputs.minutes || '5' }}
          SKIN: ${{ inputs.skin || 'rotate' }}
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          allowed = {
              "VERSIONS": ["26.3", "1.21.11", "1.21.10", "1.21.8", "1.21.4", "1.21.1", "1.20.6", "1.20.4",
                           "1.20.1", "1.19.4", "1.19.2", "1.18.2", "1.17.1", "1.16.5",
                           "1.15.2", "1.14.4", "1.12.2", "1.8.9", "1.7.10"],
              "LOADERS": ["vanilla", "fabric", "quilt", "neoforge", "forge"],
              "MODS": ["none", "medium"],
          }
          skins = ["animcape", "hd256", "anim64", "slim128", "hd512", "anim256", "legacy256", "classic", "cape", "none"]
          picked = {}
          for key, options in allowed.items():
              items = [s.strip() for s in os.environ[key].split(",") if s.strip()]
              bad = [s for s in items if s not in options]
              if bad or not items:
                  sys.exit(f"{key}: use some of {', '.join(options)}")
              picked[key] = list(dict.fromkeys(items))
          skin = os.environ["SKIN"].strip()
          if skin != "rotate" and skin not in skins:
              sys.exit(f"skin: rotate or one of {', '.join(skins)}")
          try:
              minutes = float(os.environ["MINUTES"])
          except ValueError:
              sys.exit("minutes: a number")
          if not 0.5 <= minutes <= 60:
              sys.exit("minutes: 0.5 to 60")
          # 1.12.2 and older are Forge only, 1.14.4 to 1.20.1 have no NeoForge build; the game with
          # no loader plays without mods.
          legacy = ["1.16.5", "1.17.1", "1.18.2", "1.19.2", "1.19.4", "1.20.1"]
          def playable(version, loader, mods):
              if version in ("1.12.2", "1.8.9", "1.7.10"):
                  return loader == "forge"
              if version in legacy + ["1.14.4", "1.15.2"] and loader == "neoforge":
                  return False
              return loader != "vanilla" or mods == "none"
          # The mod's folders (mod/settings.gradle) that build each version's jars and bot.
          bands = {"1.21.1": "mc-1.21.1", "1.21.4": "mc-1.21.2-1.21.4", "1.21.8": "mc-1.21.5-1.21.8",
                   "1.21.10": "mc-1.21.9-1.21.10", "1.21.11": "mc-1.21.11"}
          def folders(version):
              if version in ("26.3", "1.12.2", "1.8.9", "1.7.10"):
                  return [f"mc-{version}", f"gametest:mc-{version}"]
              if version in legacy:
                  # One Fabric jar (built against 1.20.1) and two Forge jars serve 1.16 to
                  # 1.20.1; the bot and the agent are built for the release itself.
                  forge = "1.16.5" if version == "1.16.5" else "1.20.1"
                  return ["mc-1.16.5-1.20.1:fabric:1.20.1", f"mc-1.16.5-1.20.1:forge:{forge}",
                          f"agents:{version}"] + [
                      f"gametest:mc-1.16.5-1.20.1:{loader}:{version}" for loader in ("fabric", "forge", "agent")]
              if version in ("1.14.4", "1.15.2"):
                  # The Fabric jar for 1.15.2 is the 1.15.2 to 1.20.1 one; 1.14.4 has its own.
                  fabric = "mc-1.14.4-1.15.2:fabric:1.14.4" if version == "1.14.4" else "mc-1.16.5-1.20.1:fabric:1.20.1"
                  return [fabric, f"mc-1.14.4-1.15.2:forge:{version}", f"agents:{version}"] + [
                      f"gametest:mc-1.14.4-1.15.2:{loader}:{version}" for loader in ("fabric", "forge", "agent")]
              if version in ("1.20.4", "1.20.6"):
                  # mc-1.21.1's Fabric jar serves 1.20.2 on and its NeoForge jar 1.20.6 on;
                  # the other Forge and NeoForge jars are built against the release.
                  neoforge = "mc-1.21.1:neoforge" if version == "1.20.6" else f"mc-1.20.2-1.20.6:neoforge:{version}"
                  return ["mc-1.21.1:fabric", neoforge, f"mc-1.20.2-1.20.6:forge:{version}",
                          f"agents:{version}"] + [
                      f"gametest:mc-1.20.2-1.20.6:{loader}:{version}" for loader in ("fabric", "forge", "neoforge", "agent")]
              return [bands[version], f"agents:{version}", f"gametest:mc-{version}"]
          scenarios = []
          for version in picked["VERSIONS"]:
              for loader in picked["LOADERS"]:
                  for mods in picked["MODS"]:
                      if not playable(version, loader, mods):
                          continue
                      s = skins[len(scenarios) % len(skins)] if skin == "rotate" else skin
                      scenarios.append({"version": version, "loader": loader, "mods": mods, "skin": s,
                                        "name": f"{version} {loader} {mods} {s}"})
          if not scenarios:
              sys.exit("no scenario: 1.12.2 and older are Forge only, 1.14.4 to 1.20.1 have no NeoForge, vanilla plays without mods")
          # Played again with the newest mods after the locked ones.
          newest = [s for s in scenarios if s["mods"] == "medium"] if os.environ["NEWEST"] == "true" else []
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"scenarios={json.dumps(scenarios)}\n")
              out.write(f"newest={json.dumps(newest)}\n")
              out.write(f"minutes={minutes:g}\n")
              out.write(f"folders={','.join(f for v in picked['VERSIONS'] for f in folders(v))}\n")
          print(f"{len(scenarios)} scenarios, {minutes:g} minutes each")
          EOF

  jars:
    name: Build the bot and the skins mod
    needs: plan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      # Only the picked versions' folders: each Forge release is set up before the build.
      - name: Build
        env:
          ONLY: ${{ needs.plan.outputs.folders }}
        # A build that failed on a download is tried once more through the mirror.
        run: bash ../.github/gradle/ci-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: gametest-jars
          path: |
            mod/*/*/build/libs/launcherskins-*.jar
            mod/*/*/*/build/libs/launcherskins-*.jar
            mod/gametest/mc-*/*/build/libs/launchergametest-*.jar
            mod/gametest/mc-*/*/*/build/libs/launchergametest-*.jar
            !mod/**/*-sources.jar
            !mod/**/*-dev.jar
            !mod/**/*-named.jar
          retention-days: 3

  harness:
    name: Build the test harness
    needs: plan
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build
        working-directory: src-tauri
        run: |
          exe=$(cargo test --locked --test live_gametest --no-run --message-format=json \
            | python -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable')][-1])")
          mkdir -p ../harness
          cp "$exe" ../harness/live_gametest.exe
      - uses: actions/upload-artifact@v7
        with:
          name: gametest-harness
          path: harness/live_gametest.exe
          retention-days: 3

  play:
    # All scenarios in one job: the test machine downloads the jars, the harness and
    # the actions once per run and uploads the results once, not once per scenario.
    name: Play the scenarios
    needs: [plan, jars, harness]
    runs-on: [self-hosted, windows, x64, gametest]
    timeout-minutes: 1440
    env:
      SCENARIOS: ${{ needs.plan.outputs.scenarios }}
      GAMETEST_MOD_VERSIONS: locked
      RESULTS: gametest-results
      LOCK: gametest-lock-gate
    outputs:
      played: ${{ steps.play.outputs.played }}
    defaults: &on-the-test-machine
      run:
        # Windows PowerShell as the runner's user runs no script files by
        # default (execution policy Restricted); the policy is lifted for these
        # steps only, the machine's setting stays as it is.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    # The newest job plays with the same steps.
    steps: &play
      - uses: actions/download-artifact@v8
        with:
          name: gametest-jars
          path: gt/jars-tree
      - uses: actions/download-artifact@v8
        with:
          name: gametest-harness
          path: gt/bin
      - name: Play
        id: play
        env:
          GAMETEST_MINUTES: ${{ needs.plan.outputs.minutes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $jars = New-Item -ItemType Directory -Force gt/jars
          Get-ChildItem gt/jars-tree -Recurse -Filter *.jar | Copy-Item -Destination $jars
          # Kept between runs: games, Java and mods are downloaded once.
          if (-not $env:GAMETEST_ROOT) { $env:GAMETEST_ROOT = Join-Path $env:LOCALAPPDATA 'launcher-gametest' }
          $env:LAUNCHER_LIVE_ROOT = $env:GAMETEST_ROOT
          $env:GAMETEST_JARS = $jars.FullName
          $env:GAMETEST_OUT = (New-Item -ItemType Directory -Force gt/out).FullName
          # With the newest mods a failure is another mod's news: a warning.
          $newest = $env:GAMETEST_MOD_VERSIONS -eq 'newest'
          $failed = 0
          $played = 0
          # One scenario after another; a failed one does not stop the rest.
          foreach ($s in ($env:SCENARIOS | ConvertFrom-Json)) {
            $env:GAMETEST_VERSION = $s.version
            $env:GAMETEST_LOADER = $s.loader
            $env:GAMETEST_MODS = $s.mods
            $env:GAMETEST_SKIN = $s.skin
            Write-Host "::group::$($s.name)"
            & gt/bin/live_gametest.exe --ignored --nocapture --test-threads=1
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            # A pass is "warned" with a mod of the set replaced, "theirs" when another
            # mod or a download stopped the play, "unchanged" when the newest mods are
            # the locked ones (docs/GAMETEST.md).
            $status = if ($code -eq 0) { 'passed' } else { 'failed' }
            $result = Join-Path $env:GAMETEST_OUT "$($s.version)-$($s.loader)-$($s.mods)-$($s.skin)/result.json"
            if ($code -eq 0 -and (Test-Path $result)) {
              $said = (Get-Content $result -Raw -Encoding UTF8 | ConvertFrom-Json).status
              if ($said -in 'warned', 'theirs', 'unchanged') { $status = $said }
            }
            if ($status -in 'passed', 'warned') { $played++ }
            if ($status -eq 'failed' -and $newest) {
              Write-Host "::warning::$($s.name) failed with the newest mods"
            } elseif ($status -eq 'failed') {
              $failed++
              Write-Host "::error::$($s.name) failed"
            } elseif ($status -eq 'warned') {
              Write-Host "::warning::$($s.name) passed with a mod of the set replaced or left out"
            } elseif ($status -eq 'theirs') {
              Write-Host "::warning::$($s.name) not played to the end: another mod or a download failed"
            }
            Add-Content gt/results.txt "$($s.name)`t$status"
          }
          Add-Content $env:GITHUB_OUTPUT "played=$played"
          if ($failed) { exit 1 }
      - name: Summary
        if: always()
        run: |
          # Windows PowerShell's utf8 adds a byte-order mark; the summary takes plain UTF-8.
          $utf8 = New-Object Text.UTF8Encoding $false
          $text = if ($env:GAMETEST_MOD_VERSIONS -eq 'newest') { "## With the newest mods`n`n" } else { '' }
          $text += "| Scenario | Result |`n| --- | --- |`n"
          # Plain ASCII: Windows PowerShell reads this script in the ANSI code page.
          $words = @{
            passed = 'passed'
            warned = '**passed, a mod of the set replaced or left out**'
            theirs = '**not ours: another mod or a download failed**'
            unchanged = 'the locked mods: not played again'
          }
          foreach ($line in (Get-Content gt/results.txt -ErrorAction SilentlyContinue)) {
            $name, $status = $line -split "`t"
            $shown = $words[$status]
            $text += "| $name | $(if ($shown) { $shown } else { '**failed**' }) |`n"
          }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$text`n", $utf8)
          Get-ChildItem gt/out -Recurse -Filter summary.md -ErrorAction SilentlyContinue |
            ForEach-Object {
              [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, [IO.File]::ReadAllText($_.FullName), $utf8)
            }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.RESULTS }}
          path: gt/out
          retention-days: 7
          if-no-files-found: ignore
      # The sets that passed with the newest versions, for the lock job.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.LOCK }}
          path: gt/out/*/lock.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Clean the workspace
        if: always()
        run: Remove-Item -Recurse -Force gt -ErrorAction SilentlyContinue

  newest:
    # The medium scenarios again with each mod's newest version that fits and the
    # loader's newest build: a failure is a warning. A scenario whose newest mods are
    # the locked ones is not played again.
    name: Play with the newest mods
    needs: [plan, jars, harness, play]
    if: >-
      !cancelled() && needs.jars.result == 'success' && needs.harness.result == 'success'
      && needs.plan.outputs.newest != '[]' && needs.plan.outputs.newest != ''
    runs-on: [self-hosted, windows, x64, gametest]
    timeout-minutes: 1440
    env:
      SCENARIOS: ${{ needs.plan.outputs.newest }}
      GAMETEST_MOD_VERSIONS: newest
      RESULTS: gametest-newest-results
      LOCK: gametest-lock-newest
    defaults: *on-the-test-machine
    steps: *play

  lock:
    # The sets that passed with the newest versions go into the lock on main (the
    # newest run's over the gate's), so the next runs play them.
    name: Lock the mod sets that passed
    needs: [play, newest]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          pattern: gametest-lock-gate
          path: ${{ runner.temp }}/lock/gate
      - uses: actions/download-artifact@v8
        with:
          pattern: gametest-lock-newest
          path: ${{ runner.temp }}/lock/newest
      - name: Commit the locked sets
        env:
          FRAGMENTS: ${{ runner.temp }}/lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          lock=src-tauri/tests/gametest/medium.lock.json
          # main may move meanwhile: each try starts from its newest commit.
          for try in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -I .github/gametest/lock.py "$lock" "$FRAGMENTS/gate" "$FRAGMENTS/newest" "$RUNNER_TEMP/lock.md"
            if git diff --quiet -- "$lock"; then exit 0; fi
            git commit -q -m 'Game test: lock the medium mod sets that passed' -- "$lock"
            if git push -q origin HEAD:main; then
              cat "$RUNNER_TEMP/lock.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((try * 10))
          done
          echo '::error::The locked sets could not be pushed to main.'
          exit 1

  stable:
    name: Skins mod for the stable channel?
    needs: play
    if: >-
      github.ref == 'refs/heads/main' && needs.play.result == 'success'
      && (github.event_name == 'schedule' || inputs.promote)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYED: ${{ needs.play.outputs.played }}
        run: |
          set -uo pipefail
          # Others' trouble does not hold the run, but a run that played nothing shows nothing.
          if [ "${PLAYED:-0}" = "0" ]; then
            echo "::notice::No scenario was played to the end: nothing for stable."; exit 0
          fi
          version=$(tr -d '[:space:]' < mod/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::mod/VERSION is not a version"; exit 1; }
          listed() {
            curl -fsS --max-time 10 "https://upd.lapi.sh/v1/$1/skins-mod-list.json" | jq -r '.list | fromjson | .version' 2>/dev/null
          }
          if ! gh release view "skins-mod-v$version" >/dev/null 2>&1; then
            echo "::notice::Skins mod $version is not released: nothing for stable."; exit 0
          fi
          # The test played this commit's build: the same code as the release's.
          if ! git diff --quiet "skins-mod-v$version" HEAD -- mod ':(exclude)mod/gametest'; then
            echo "::notice::The mod changed since release $version: nothing for stable."; exit 0
          fi
          if [ "$(listed beta)" != "$version" ]; then
            echo "::notice::Beta does not have $version (or went back): nothing for stable."; exit 0
          fi
          if [ "$(listed stable)" = "$version" ]; then
            echo "Stable has $version already."; exit 0
          fi
          echo "Giving $version to stable."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  promote:
    name: Stable channel
    needs: stable
    if: needs.stable.outputs.version != ''
    uses: ./.github/workflows/skins-mod-list.yml
    with:
      version: ${{ needs.stable.outputs.version }}
      channels: stable
    secrets: inherit
