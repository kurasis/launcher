name: Feed service

# The launcher's start page feed at feed.lapi.sh (docs/DECISIONS.md D-067):
# tests, a release build, and a deploy over SSH to /home/www/lapi/feed. The
# server needs deploy/bootstrap.sh run as root once, and again when the nginx
# files change (the deploy warns).
#
# Secrets: DEEPL_API_KEY (translations of patch notes and news),
# TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET (live streams) go to the server
# through standard input, never a command line. Without them those parts of
# the feed are left out.
#
# This repository is public, and so are its workflow logs: nothing about a
# player and nothing about the server is printed here. "Run workflow" with
# task=counts shows numbers only.

on:
  push:
    branches: [main]
    paths:
      - services/feed/**
      - deploy/feed/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/feed-service.yml
      - .github/actions/**
  pull_request:
    paths:
      - services/feed/**
      - deploy/feed/**
      - deploy/*.sh
      - deploy/nginx/**
      - .github/workflows/feed-service.yml
      - .github/actions/**
  workflow_dispatch:
    inputs:
      task:
        description: deploy, or counts of what the feed holds
        type: choice
        options: [deploy, counts]
        default: deploy

permissions:
  contents: read

concurrency:
  group: feed-service-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/feed
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            services/feed/target
          key: feed-${{ hashFiles('services/feed/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Ubuntu 24.04's glibc (2.39) is older than Debian 13's (2.41), so the
      # binary runs there.
      - run: cargo build --locked --release
      - name: Check the nginx files
        working-directory: ${{ github.workspace }}
        run: bash deploy/check-nginx.sh
      - name: Package the release
        run: |
          mkdir -p ../../dist-feed/nginx
          cp target/release/lapi-feed ../../dist-feed/
          cp ../../deploy/nginx/* ../../deploy/feed/nginx/* ../../dist-feed/nginx/
          tar -czf ../../lapi-feed.tar.gz -C ../../dist-feed .
      - uses: actions/upload-artifact@v7
        with:
          name: lapi-feed
          path: lapi-feed.tar.gz
          retention-days: 14

  deploy:
    # One deploy of this service at a time, from any branch or run.
    concurrency:
      group: feed-deploy
      cancel-in-progress: false
    name: Deploy to feed.lapi.sh
    # Deploys use the production environment: Settings → Environments →
    # production → Required reviewers makes each one wait for an approval.
    environment: production
    needs: test
    # Only main reaches production, also when run by hand.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.task == 'deploy'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lapi-feed
      - uses: ./.github/actions/lapi-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/lapi-upload
        with:
          service: feed
          target: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          set +e
          # The secrets travel on standard input; deploy.sh keeps them in
          # secrets.env (0640) and prints only their names.
          printf 'LAPI_FEED_DEEPL_KEY=%s\nLAPI_FEED_TWITCH_CLIENT_ID=%s\nLAPI_FEED_TWITCH_SECRET=%s\n' \
            "$DEEPL_API_KEY" "$TWITCH_CLIENT_ID" "$TWITCH_CLIENT_SECRET" |
            ssh "$TARGET" \
              "bash ~/.lapi-bootstrap/$SETUP/deploy.sh feed $RELEASE $ARCHIVE --secrets" 2>&1 | tee deploy.log
          status=${PIPESTATUS[1]}
          if grep -q NOT_BOOTSTRAPPED deploy.log; then
            echo "::warning::The server is not set up yet: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it once, then re-run this workflow."
            exit 0
          fi
          if grep -qE 'NGINX_(PENDING|CHANGED)' deploy.log; then
            echo "::warning::The nginx files on the server are not these: run 'sudo bash ~/lapi-bootstrap/bootstrap.sh <deploy-user>' on it to apply them."
          fi
          exit "$status"
      - uses: ./.github/actions/lapi-check
        with:
          service: feed
          ssh-host: ${{ secrets.SSH_HOST }}

  counts:
    name: Feed counts
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'counts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lapi-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      # `counts` prints numbers only: the logs of this public repository must
      # not hold a nick or anything else about a player.
      - name: Counts
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          {
            echo '### Feed'
            echo '```json'
            ssh "$TARGET" \
              'sudo -n -u lapi-feed /home/www/lapi/feed/current/lapi-feed counts'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
