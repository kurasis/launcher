# Temporary measurement (not for main): what the main window shows from the moment
# it appears until the interface draws, on Windows, with this branch and with main.
# Numbers and fixed words only.
name: First frame bench

on:
  push:
    branches: [claude/project-thread-nlolh0]
    paths: ['.github/bench-firstframe/**', '.github/workflows/bench-firstframe.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LAUNCHER_MSA_CLIENT_ID: ${{ vars.LAUNCHER_MSA_CLIENT_ID }}

jobs:
  # Package's Windows job id, so that main's Rust cache is restored on a build.
  windows:
    name: First frame ${{ matrix.leg }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: [branch, main]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Keep the bench, build main for the baseline
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          cp .github/bench-firstframe/firstframe.ps1 "$RUNNER_TEMP/bench/"
          if [ "${{ matrix.leg }}" = main ]; then
            git fetch --depth 1 origin main
            git checkout --force --detach FETCH_HEAD
            git clean -fdx
          fi
          git log --oneline -1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Launcher built by an earlier run
        id: built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: src-tauri/target/release/launcher.exe
          key: bench-firstframe-${{ matrix.leg }}-${{ hashFiles('src/**', 'src-tauri/src/**', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json', 'package-lock.json', 'vite.config.ts', 'index.html') }}

      - name: Install pinned Rust toolchain
        if: steps.built.outputs.cache-matched-key == ''
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.built.outputs.cache-matched-key == ''
        with:
          workspaces: src-tauri
          save-if: false

      - run: npm ci
        if: steps.built.outputs.cache-matched-key == ''

      # The windows exactly as packaged (tauri.conf.json), without an installer.
      - name: Build the launcher (release, no installer)
        if: steps.built.outputs.cache-matched-key == ''
        run: npx tauri build --ci --no-bundle -- --locked

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.built.outputs.cache-matched-key == ''
        with:
          path: src-tauri/target/release/launcher.exe
          key: ${{ steps.built.outputs.cache-primary-key }}

      - name: Measure
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # The bench's starts must not count as players' starts.
          Add-Content -Path "$env:windir\System32\drivers\etc\hosts" -Value "`n0.0.0.0 stats.lapi.sh`n:: stats.lapi.sh"
          # The window (1100x720) does not fit the runner's 1024x768 screen.
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host 'resolution set' } catch { Write-Host 'resolution unchanged' }
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "screen $($b.Width)x$($b.Height)"
          $exe = (Resolve-Path src-tauri/target/release/launcher.exe).Path
          & "$env:RUNNER_TEMP\bench\firstframe.ps1" -Exe $exe -DataRoot (Join-Path $env:LOCALAPPDATA 'app.launcher') -Out "$env:RUNNER_TEMP\frames"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: first-frame-${{ matrix.leg }}
          path: ${{ runner.temp }}/frames
          retention-days: 3
          if-no-files-found: ignore
