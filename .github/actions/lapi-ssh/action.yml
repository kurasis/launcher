name: SSH to the lapi server
description: >-
  Writes the deploy key and the server's known host key for ssh and scp. The
  repository is public, so ssh prints errors only: no warning that could name
  the server's address.
inputs:
  ssh-key:
    description: The deploy user's private key (secret SSH_KEY).
    required: true
  known-hosts:
    description: The server's host key line (secret SSH_KNOWN_HOSTS).
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        cat > ~/.ssh/config <<'CONF'
        Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            CheckHostIP no
            LogLevel ERROR
        CONF
        chmod 600 ~/.ssh/config
