# Pull requests for dependency updates, grouped, once a month. Major versions
# are left out: those change behaviour and are agreed on first. Security
# updates come separately as soon as GitHub knows of one (Settings → Code
# security → Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      interface:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /services/crash
      - /services/friends
      - /services/worlds
      - /services/relay
      - /services/skins
      - /services/mirror
      - /services/oauth
      - /services/upd
      - /services/mods
      - /services/reviews
      - /services/feed
      - /services/servers
      - /services/stats
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      rust:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # Actions are pinned by commit SHA with the tag in a comment; Dependabot
  # moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch, major]
