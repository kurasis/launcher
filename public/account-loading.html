<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launcher account</title>
    <link rel="stylesheet" href="account-loading.css" />
  </head>
  <!--
    Shown in the launcher account window while the account server's page
    loads (D-064); the launcher then opens that page. No scripts.
  -->
  <body>
    <main class="loading" role="status" aria-label="Loading">
      <div class="mark" aria-hidden="true"></div>
      <div class="ring" aria-hidden="true"></div>
      <div class="bar" aria-hidden="true"><span></span></div>
    </main>
  </body>
</html>
