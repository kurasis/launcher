# upd.lapi.sh (D-063). Installed by deploy/bootstrap.sh (root) into
# /etc/nginx/lapi/ with 00-lapi-common.conf; deploys do not touch it. TLS lines
# come from /etc/nginx/lapi-tls. Static files only: lapi-upd writes them.
limit_req_zone $binary_remote_addr zone=lapi_upd:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=lapi_upd_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name upd.lapi.sh;
    include /etc/nginx/lapi/upd-site.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name upd.lapi.sh;
    include /etc/nginx/lapi-tls/upd.lapi.sh.conf;
    include /etc/nginx/lapi/upd-site.inc;
}
