# reviews.lapi.sh: reviews players send from the launcher (D-070). Installed
# by deploy/bootstrap.sh (root) into /etc/nginx/lapi/ with
# 00-lapi-common.conf; deploys do not touch it. TLS lines come from
# /etc/nginx/lapi-tls.
#
# Players send reviews (POST, at most 16 MiB) and read the answers to their own;
# reviews are read and answered with the owner's commands on the server alone
# (docs/REVIEWS.md). Four paths, each with its own methods.
limit_req_zone $binary_remote_addr zone=lapi_reviews:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lapi_reviews_post:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=lapi_reviews_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name reviews.lapi.sh;
    include /etc/nginx/lapi/reviews-site.inc;
    # A visitor who reached Cloudflare over plain HTTP goes to HTTPS. Cloudflare's
    # own HTTPS may still arrive here (its "Flexible" mode) and says so in
    # CF-Visitor: no loop.
    if ($http_cf_visitor !~ '"scheme":"https"') {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reviews.lapi.sh;
    include /etc/nginx/lapi-tls/reviews.lapi.sh.conf;
    include /etc/nginx/lapi/reviews-site.inc;
}
