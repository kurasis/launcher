# mirror.lapi.sh (D-062). Installed by deploy/bootstrap.sh (root) into
# /etc/nginx/lapi/ with 00-lapi-common.conf; deploys do not touch it. TLS lines
# come from /etc/nginx/lapi-tls.
#
# A player's install asks for thousands of files, so the limits count
# connections and allow bursts; Cloudflare's edge answers most requests.
limit_req_zone $binary_remote_addr zone=lapi_mirror:20m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=lapi_mirror_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mirror.lapi.sh;
    include /etc/nginx/lapi/mirror-site.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mirror.lapi.sh;
    include /etc/nginx/lapi-tls/mirror.lapi.sh.conf;
    include /etc/nginx/lapi/mirror-site.inc;
}
