# oauth.lapi.sh: launcher accounts (D-064). Installed by deploy/bootstrap.sh
# (root) into /etc/nginx/lapi/ with 00-lapi-common.conf; deploys do not touch
# it. TLS lines come from /etc/nginx/lapi-tls.
limit_req_zone $binary_remote_addr zone=lapi_oauth:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=lapi_oauth_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name oauth.lapi.sh;
    include /etc/nginx/lapi/oauth-site.inc;
    # A visitor who reached Cloudflare over plain HTTP goes to HTTPS before a
    # password or token is sent. Cloudflare's own HTTPS may still arrive here
    # (its "Flexible" mode) and says so in CF-Visitor: no loop.
    if ($http_cf_visitor !~ '"scheme":"https"') {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oauth.lapi.sh;
    include /etc/nginx/lapi-tls/oauth.lapi.sh.conf;
    include /etc/nginx/lapi/oauth-site.inc;
}
