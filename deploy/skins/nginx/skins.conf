# skins.lapi.sh: skins and capes of launcher accounts (D-065). Installed
# by deploy/bootstrap.sh (root) into /etc/nginx/lapi/ with
# 00-lapi-common.conf; deploys do not touch it. TLS lines come from
# /etc/nginx/lapi-tls.
#
# Players fetch many profiles and textures when they join a server, so the
# limit per address is wider than friends'; uploads have their own, narrow
# one (the service allows 10 an hour per account besides).
limit_req_zone $binary_remote_addr zone=lapi_skins:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=lapi_skins_upload:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=lapi_skins_conn:10m;
# A lookup names a nick in its address: logged without it.
log_format lapi_skins_lookup '$lapi_client_network [$time_local] "$request_method /v1/profile/-" '
                             '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name skins.lapi.sh;
    include /etc/nginx/lapi/skins-site.inc;
    # A visitor who reached Cloudflare over plain HTTP goes to HTTPS before a
    # token is sent. Cloudflare's own HTTPS may still arrive here (its
    # "Flexible" mode) and says so in CF-Visitor: no loop.
    if ($http_cf_visitor !~ '"scheme":"https"') {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skins.lapi.sh;
    include /etc/nginx/lapi-tls/skins.lapi.sh.conf;
    include /etc/nginx/lapi/skins-site.inc;
}
