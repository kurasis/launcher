# feed.lapi.sh: the launcher's start page feed (D-067). Installed by
# deploy/bootstrap.sh (root) into /etc/nginx/lapi/ with 00-lapi-common.conf;
# deploys do not touch it. TLS lines come from /etc/nginx/lapi-tls.
#
# Everything is public and read-only, kept by Cloudflare for a minute or
# more, so most requests never reach here. Channel lookups ask YouTube: they
# have their own, narrow limit (the service allows 10 a minute besides).
limit_req_zone $binary_remote_addr zone=lapi_feed:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=lapi_feed_lookup:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=lapi_feed_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name feed.lapi.sh;
    include /etc/nginx/lapi/feed-site.inc;
    # A visitor who reached Cloudflare over plain HTTP goes to HTTPS. Cloudflare's
    # own HTTPS may still arrive here (its "Flexible" mode) and says so in
    # CF-Visitor: no loop.
    if ($http_cf_visitor !~ '"scheme":"https"') {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feed.lapi.sh;
    include /etc/nginx/lapi-tls/feed.lapi.sh.conf;
    include /etc/nginx/lapi/feed-site.inc;
}
