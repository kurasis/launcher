# crash.lapi.sh (D-061). Deployed to /home/www/lapi/nginx/crash.conf by
# deploy/crash/deploy.sh; TLS lines come from /etc/nginx/lapi-tls (bootstrap.sh).
limit_req_zone $binary_remote_addr zone=lapi_crash:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name crash.lapi.sh;
    include /home/www/lapi/nginx/cloudflare-real-ip.inc;

    location /.well-known/acme-challenge/ {
        root /home/www/lapi/acme;
    }
    location /v1/ {
        include /home/www/lapi/nginx/crash-proxy.inc;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crash.lapi.sh;
    include /etc/nginx/lapi-tls/crash.lapi.sh.conf;
    include /home/www/lapi/nginx/cloudflare-real-ip.inc;

    location /.well-known/acme-challenge/ {
        root /home/www/lapi/acme;
    }
    location /v1/ {
        include /home/www/lapi/nginx/crash-proxy.inc;
    }
    location / {
        return 404;
    }
}
