# crash.lapi.sh (D-061). Installed by deploy/crash/bootstrap.sh (root) into
# /etc/nginx/lapi/, which only root can change: whoever writes nginx config
# can make root write files, so deploys do not touch it. TLS lines come from
# /etc/nginx/lapi-tls.
limit_req_zone $binary_remote_addr zone=lapi_crash:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=lapi_crash_conn:10m;

# Only Cloudflare and this server itself may connect: the origin cannot be
# reached around Cloudflare's protection. Checked on the connection's own
# address, before the real-IP module replaces it.
geo $realip_remote_addr $lapi_crash_peer {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    include /etc/nginx/lapi/cloudflare-geo.inc;
}

# The access log keeps networks, not addresses (D-061: no IP addresses kept).
map $remote_addr $lapi_crash_network {
    "~^(?<net4>\d+\.\d+\.\d+)\.\d+$" "$net4.0";
    "~^(?<net6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "$net6::";
    default "-";
}
log_format lapi_crash '$lapi_crash_network [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name crash.lapi.sh;
    include /etc/nginx/lapi/crash-site.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crash.lapi.sh;
    include /etc/nginx/lapi-tls/crash.lapi.sh.conf;
    include /etc/nginx/lapi/crash-site.inc;
}
