# Shared by every service under /home/www/lapi (D-061, D-062). Installed by
# Named to load before the services' files, which use what it defines.
# deploy/bootstrap.sh (root) into /etc/nginx/lapi/, which only root changes:
# whoever writes nginx config can make root write files.

# Only Cloudflare and this server itself may connect: no service can be reached
# around Cloudflare's protection. Checked on the connection's own address,
# before the real-IP module replaces it.
geo $realip_remote_addr $lapi_via_cloudflare {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    include /etc/nginx/lapi/cloudflare-geo.inc;
}

# Access logs keep networks, not addresses (D-061: no IP addresses kept).
map $remote_addr $lapi_client_network {
    "~^(?<net4>\d+\.\d+\.\d+)\.\d+$" "$net4.0";
    "~^(?<net6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "$net6::";
    default "-";
}
log_format lapi_anon '$lapi_client_network [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent $request_time';
