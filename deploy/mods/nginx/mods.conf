# mods.lapi.sh, the catalog's API, and files-mods.lapi.sh, its kept files
# (D-065). Installed by deploy/bootstrap.sh (root) into /etc/nginx/lapi/ with
# 00-lapi-common.conf; deploys do not touch it. One certificate covers both
# names; its TLS lines come from /etc/nginx/lapi-tls/mods.lapi.sh.conf.
limit_req_zone $binary_remote_addr zone=lapi_mods:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=lapi_mods_conn:10m;
limit_req_zone $binary_remote_addr zone=lapi_mods_files:20m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=lapi_mods_files_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mods.lapi.sh;
    include /etc/nginx/lapi/mods-site.inc;
    # A visitor who reached Cloudflare over plain HTTP goes to HTTPS before a
    # token is sent. Cloudflare's own HTTPS may still arrive here (its
    # "Flexible" mode) and says so in CF-Visitor: no loop.
    if ($http_cf_visitor !~ '"scheme":"https"') {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mods.lapi.sh;
    include /etc/nginx/lapi-tls/mods.lapi.sh.conf;
    include /etc/nginx/lapi/mods-site.inc;
}

server {
    listen 80;
    listen [::]:80;
    server_name files-mods.lapi.sh;
    include /etc/nginx/lapi/mods-files.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name files-mods.lapi.sh;
    include /etc/nginx/lapi-tls/mods.lapi.sh.conf;
    include /etc/nginx/lapi/mods-files.inc;
}
