# stats.lapi.sh: anonymous statistics of the launcher and counts of the server
# ads (D-071). Installed by deploy/bootstrap.sh (root) into /etc/nginx/lapi/
# with 00-lapi-common.conf; deploys do not touch it. TLS lines come from
# /etc/nginx/lapi-tls.
#
# Write only from outside: POST of a ping (once a day) and of a batch of
# counts (hourly), each a few kilobytes, and GET of the health check. The
# numbers are read on the server with the command line alone (docs/STATS.md).
# Generous per address: many players can share one behind a carrier's NAT.
limit_req_zone $binary_remote_addr zone=lapi_stats:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=lapi_stats_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name stats.lapi.sh;
    include /etc/nginx/lapi/stats-site.inc;
    # A visitor who reached Cloudflare over plain HTTP goes to HTTPS. Cloudflare's
    # own HTTPS may still arrive here (its "Flexible" mode) and says so in
    # CF-Visitor: no loop.
    if ($http_cf_visitor !~ '"scheme":"https"') {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.lapi.sh;
    include /etc/nginx/lapi-tls/stats.lapi.sh.conf;
    include /etc/nginx/lapi/stats-site.inc;
}
