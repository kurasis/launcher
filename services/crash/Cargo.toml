[package]
name = "lapi-crash"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Crash report intake for the Sferum launcher (D-061)"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
