[package]
name = "lapi-stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Anonymous launcher statistics and server ad counts at stats.lapi.sh (D-071)"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Time zone names checked against the IANA database.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
sha2 = "0.10"
# Plain HTTP to the ads service on this server only: no TLS, no proxies.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
