[package]
name = "lapi-servers"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Minecraft server ads for the launcher at servers.lapi.sh (D-069)"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
