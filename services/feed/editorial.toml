# Events with a countdown on the start page, shown from 14 days before they
# start until they end. Example:
#
# [[event]]
# id = "minecraft-live-2027"
# starts = "2027-03-20T17:00:00Z"
# ends = "2027-03-20T18:00:00Z"
# url = "https://www.youtube.com/@minecraft"
# title = { en = "Minecraft Live", ru = "Minecraft Live", ar = "Minecraft Live" }

# Our announcements, pinned at the top until `until`. Example:
#
# [[announcement]]
# id = "welcome"
# until = "2026-12-01T00:00:00Z"
# title = { en = "…", ru = "…", ar = "…" }
# text = { en = "…", ru = "…", ar = "…" }

# Tips of the day, one a day in turn.

[[tip]]
text = { en = "Ctrl+Shift+L opens the launcher's console with the game's log.", ru = "Ctrl+Shift+L открывает консоль лаунчера с журналом игры.", ar = "يفتح Ctrl+Shift+L وحدة تحكم المشغّل مع سجل اللعبة." }

[[tip]]
text = { en = "Snapshots can damage worlds: play them in an installation of their own.", ru = "Снапшоты могут повредить мир: играйте в них в отдельной установке.", ar = "قد تُتلف اللقطات التجريبية العوالم: العبها في تثبيت خاص بها." }

[[tip]]
text = { en = "A backup before a big update keeps your world safe. Backups are under More.", ru = "Копия перед большим обновлением сбережёт мир. Копии — в меню «Ещё».", ar = "نسخة احتياطية قبل تحديث كبير تحمي عالمك. النسخ الاحتياطية في قائمة «المزيد»." }

[[tip]]
text = { en = "In game, F3+H shows item IDs and durability in tooltips.", ru = "В игре F3+H показывает ID предметов и прочность в подсказках.", ar = "في اللعبة، يعرض F3+H معرّفات العناصر ومتانتها في التلميحات." }

[[tip]]
text = { en = "F3+B shows the hitboxes of mobs and items.", ru = "F3+B показывает хитбоксы мобов и предметов.", ar = "يعرض F3+B صناديق التصادم للكائنات والعناصر." }

[[tip]]
text = { en = "F3+Q lists every debug key combination.", ru = "F3+Q показывает все сочетания клавиш отладки.", ar = "يعرض F3+Q كل اختصارات مفاتيح التصحيح." }

[[tip]]
text = { en = "Screenshots taken with F2 appear in the launcher under More → Screenshots.", ru = "Скриншоты по F2 появляются в лаунчере: «Ещё» → «Скриншоты».", ar = "تظهر لقطات الشاشة الملتقطة بـ F2 في المشغّل: «المزيد» ← «لقطات الشاشة»." }

[[tip]]
text = { en = "Shift-click on a crafting result crafts as many as your items allow.", ru = "Shift+клик по результату крафта создаёт столько, сколько хватит ресурсов.", ar = "النقر مع Shift على نتيجة الصناعة يصنع أكبر عدد تسمح به موادك." }
