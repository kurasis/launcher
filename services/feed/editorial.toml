# What the feed shows besides its sources (D-067): YouTube channels by
# language, events with a countdown, our announcements, tips of the day and
# Twitch channels never shown. It is built into the service: a change here is
# a pull request and goes out with the next deploy.
#
# Texts are in English (en, needed) and Russian and Arabic (ru, ar; English
# is shown where one is missing). Dates are UTC, as 2026-11-01T17:00:00Z.
# Nothing about players goes here, and this repository is public.

# What the feed never lists among the most watched Minecraft streams of each
# language. A name is found anywhere in a login or shown name (any case, `_`
# aside), so a channel's copies go too: "zubaref" also covers
# zubarefff_8225539. At least 4 letters.
twitch_blocked = ["zubaref"]
# Words found anywhere in a stream's title (any case): gambling streams shown
# under Minecraft. At least 3 letters.
twitch_blocked_words = ["казино", "лудо", "1win", "1вин", "промокод", "casino", "gambling", "slots"]

