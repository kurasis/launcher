[package]
name = "lapi-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The relay for worlds with friends, admitting only keys worlds.lapi.sh allows (D-068)"
publish = false

[dependencies]
# Pinned with the launcher's iroh (src-tauri/Cargo.toml).
iroh-relay = { version = "=1.3.0", features = ["server"] }
iroh-base = { version = "=1.3.0", default-features = false, features = ["key"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
http = "1"
iroh-dns = "=1.3.0"
n0-future = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
