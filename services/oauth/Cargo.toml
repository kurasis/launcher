[package]
name = "lapi-oauth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Launcher accounts: registration, sign-in and tokens (D-064)"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = { version = "0.5", features = ["std"] }
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Already in the tree through rustls: seals letters waiting in the outbox.
ring = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
