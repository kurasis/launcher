modLoader = "javafml"
loaderVersion = "[${forge_major},)"
license = "All-Rights-Reserved"

[[mods]]
modId = "launcherskins"
version = "${version}"
displayName = "Launcher Skins"
description = "Skins and capes of launcher accounts, HD and animated, looked up by nick."

[[mixins]]
config = "launcherskins.mixins.json"

[[dependencies.launcherskins]]
modId = "minecraft"
type = "required"
# NeoForge before 20.4 (FML 1: every 1.20.2 and 1.20.3 build) refuses the jar without
# it; FML 2 reads type and passes over it.
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
