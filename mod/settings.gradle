pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        // RetroFuturaGradle, the build plugin for Forge 1.12.2.
        maven {
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroupByRegex 'com\\.gtnewhorizons\\..+'
            }
        }
        gradlePluginPortal()
    }
}

plugins {
    // Java toolchains the build asks for (ForgeGradle's launcher wants Java 8) are downloaded.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'launcher-skins'

include 'core'
include 'mc-1.21.1:fabric', 'mc-1.21.1:neoforge', 'mc-1.21.1:forge', 'mc-1.21.1:agent'
include 'mc-26.3:fabric', 'mc-26.3:neoforge', 'mc-26.3:forge', 'mc-26.3:agent'
include 'mc-1.12.2:forge'
// The test bot for game runs on the test machine (docs/GAMETEST.md); never shipped to players.
include 'gametest:core'
include 'gametest:mc-1.21.1:fabric', 'gametest:mc-1.21.1:neoforge', 'gametest:mc-1.21.1:forge', 'gametest:mc-1.21.1:agent'
include 'gametest:mc-26.3:fabric', 'gametest:mc-26.3:neoforge', 'gametest:mc-26.3:forge', 'gametest:mc-26.3:agent'
include 'gametest:mc-1.12.2:forge'
