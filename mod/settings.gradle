pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        // Architectury Loom, the build plugin for Forge 1.16.5.
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        // Unimined, the build plugin for Forge 1.8.9.
        maven {
            url = 'https://maven.wagyourtail.xyz/releases'
            mavenContent { includeGroupByRegex 'xyz\\.wagyourtail.*' }
        }
        // RetroFuturaGradle, the build plugin for Forge 1.12.2 and 1.7.10.
        maven {
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroupByRegex 'com\\.gtnewhorizons\\..+'
            }
        }
        gradlePluginPortal()
    }
}

plugins {
    // Java toolchains the build asks for (ForgeGradle's launcher wants Java 8) are downloaded.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'launcher-skins'

// `-Ponly=mc-1.21.1,agents` takes just those folders (paths as in `include`) and the
// cores. A Forge release is set up (downloaded and decompiled) when its project is
// configured, so the CI jobs that split the build each name only their own folders.
def only = providers.gradleProperty('only').map { it.split(',')*.trim().findAll() }.getOrElse([])
def add = { String path, String script = null ->
    if (only.isEmpty() || only.any { path == it || path.startsWith("${it}:") }) {
        include path
        if (script != null) {
            project(":${path}").buildFileName = script
        }
    }
}

include 'core'
// Each folder serves the game versions in its name with one jar per loader.
['mc-1.21.1', 'mc-1.21.2-1.21.4', 'mc-1.21.5-1.21.8', 'mc-1.21.9-1.21.10', 'mc-1.21.11', 'mc-26.3'].each { band ->
    ['fabric', 'neoforge', 'forge'].each { loader -> add "${band}:${loader}" }
}
add 'mc-26.3:agent'
add 'mc-1.12.2:forge'
// Forge 1.8.9: mc-1.12.2's sources built against 1.8.9 (Unimined).
add 'mc-1.8.9:forge'
add 'mc-1.7.10:forge'
// 1.16 to 1.20.1 share a game layer; each jar is a project of its own, a folder in
// mc-1.16.5-1.20.1/<loader> named after the release it is built against and built by
// that loader's script there.
['fabric', 'forge'].each { loader ->
    file("mc-1.16.5-1.20.1/${loader}").eachDir { dir ->
        if (new File(dir, 'gradle.properties').exists()) {
            // A folder with a build.gradle of its own is built by it.
            def own = new File(dir, 'build.gradle').exists()
            add "mc-1.16.5-1.20.1:${loader}:${dir.name}", own ? null : "../${loader}.gradle"
        }
    }
}
// 1.14.4 to 1.15.2 take mc-1.16.5-1.20.1's game layer: the Fabric jars for 1.14.4 and
// for 1.15 to 1.15.1 are built by that folder's Fabric script, the Forge ones (a coremod,
// no Mixin yet) by mc-1.14.4-1.15.2/forge.
['1.14.4', '1.15.1'].each { release ->
    add "mc-1.14.4-1.15.2:fabric:${release}", '../../../mc-1.16.5-1.20.1/fabric/fabric.gradle'
}
['1.14.4', '1.15.2'].each { release -> add "mc-1.14.4-1.15.2:forge:${release}", '../forge.gradle' }
// 1.20.2 to 1.20.6 take mc-1.21.1's game layer; their Forge and NeoForge jars are projects
// in mc-1.20.2-1.20.6/<loader>, each built by mc-1.20.2-1.20.6/arch.gradle.
['forge', 'neoforge'].each { loader ->
    file("mc-1.20.2-1.20.6/${loader}").eachDir { dir ->
        if (new File(dir, 'gradle.properties').exists()) {
            add "mc-1.20.2-1.20.6:${loader}:${dir.name}", '../../arch.gradle'
        }
    }
}
// The Java agent for releases with obfuscated names: one project per release, each a
// folder of mod/agents built by mod/agents/agent.gradle.
file('agents').eachDir { dir ->
    if (new File(dir, 'gradle.properties').exists()) {
        add "agents:${dir.name}", '../agent.gradle'
    }
}
// The test bot for game runs on the test machine (docs/GAMETEST.md); never shipped to players.
include 'gametest:core'
// The 1.21.x bots share mc-1.21.1's build scripts; each folder has its own game layer.
['1.21.1', '1.21.4', '1.21.8', '1.21.10', '1.21.11'].each { version ->
    ['fabric', 'neoforge', 'forge', 'agent'].each { loader ->
        add "gametest:mc-${version}:${loader}", version == '1.21.1' ? null : "../../mc-1.21.1/${loader}/build.gradle"
    }
}
['fabric', 'neoforge', 'forge', 'agent'].each { loader -> add "gametest:mc-26.3:${loader}" }
add 'gametest:mc-1.12.2:forge'
add 'gametest:mc-1.8.9:forge'
add 'gametest:mc-1.7.10:forge'
// The 1.16 to 1.20.1 bots: a project per release and loader, laid out like the mod's.
['fabric', 'forge', 'agent'].each { loader ->
    file("gametest/mc-1.16.5-1.20.1/${loader}").eachDir { dir ->
        if (new File(dir, 'gradle.properties').exists()) {
            def own = new File(dir, 'build.gradle').exists()
            add "gametest:mc-1.16.5-1.20.1:${loader}:${dir.name}", own ? null : "../${loader}.gradle"
        }
    }
}
// The 1.14.4 and 1.15.2 bots: Fabric and the agent built by the 1.16.5 to 1.20.1 bots'
// scripts, Forge (no Mixin yet: Forge's tick event) by mc-1.14.4-1.15.2/forge.
['fabric', 'forge', 'agent'].each { loader ->
    file("gametest/mc-1.14.4-1.15.2/${loader}").eachDir { dir ->
        if (new File(dir, 'gradle.properties').exists()) {
            def script = loader == 'forge' ? '../forge.gradle' : "../../../mc-1.16.5-1.20.1/${loader}/${loader}.gradle"
            add "gametest:mc-1.14.4-1.15.2:${loader}:${dir.name}", script
        }
    }
}
// The 1.20.2 to 1.20.6 bots: the same, with Forge and NeoForge built by arch.gradle there and
// Fabric and the agent by the 1.16.5 to 1.20.1 bots' scripts.
['fabric', 'forge', 'neoforge', 'agent'].each { loader ->
    file("gametest/mc-1.20.2-1.20.6/${loader}").eachDir { dir ->
        if (new File(dir, 'gradle.properties').exists()) {
            def script = loader in ['forge', 'neoforge'] ? '../../arch.gradle' : "../../../mc-1.16.5-1.20.1/${loader}/${loader}.gradle"
            add "gametest:mc-1.20.2-1.20.6:${loader}:${dir.name}", script
        }
    }
}
