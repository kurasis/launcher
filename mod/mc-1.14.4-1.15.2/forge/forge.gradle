plugins {
    id 'dev.architectury.loom' version '1.17.493'
}

// The Forge jars for 1.14.2 to 1.16.4 (a project in the folder of the release each is built
// against). Forge has no Mixin before 1.16.1 (and not in every 1.16.1 build), so a JavaScript coremod (src/main/resources) passes what
// the player's skin getters return through LauncherSkins, as the Mixin of 1.16.5 on does.
// The game layer is mc-1.16.5-1.20.1's; Architectury Loom remaps the jar to the release's
// SRG names, which differ between the two for what the layer uses.
base {
    archivesName = "launcherskins-forge-${band}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

def layer = "${rootDir}/mc-1.16.5-1.20.1"

sourceSets.main {
    java.srcDir "${rootDir}/core/src/main/java"
    java.srcDir "${layer}/common/src/main/java"
    java.exclude 'app/launcher/skins/mixin/**'
    java.srcDir "${layer}/forge/src/main/java"
    resources.srcDir "${layer}/forge/src/main/resources"
    resources.srcDir "${projectDir}/../src/main/resources"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version, minecraft: forge_range, forge_major: forge_min,
                 pack_format: pack_format]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}
