plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

// The Java agent for Minecraft 1.21.1 with no mod loader: `-javaagent:` on the game's
// command line. It is written in Mojang names like the loaders' code, then remapped to
// the names of the released (obfuscated) game. ASM rewrites the class; it is bundled
// under our own package so it cannot clash with anything on the game's class path.
base {
    archivesName = "launcherskins-agent-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets.main {
    java.srcDir "${rootDir}/core/src/main/java"
    java.srcDir "${projectDir}/../common/src/main/java"
    java.exclude 'app/launcher/skins/mixin/**'
}

configurations {
    bundled
    implementation.extendsFrom bundled
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    bundled 'org.ow2.asm:asm:9.9'
    bundled 'org.ow2.asm:asm-tree:9.9'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

shadowJar {
    configurations = [project.configurations.bundled]
    relocate 'org.objectweb.asm', 'app.launcher.skins.agent.asm'
    exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/maven/**'
    archiveClassifier = 'named'
    manifest {
        attributes(
            'Premain-Class': 'app.launcher.skins.agent.Agent',
            'Implementation-Title': 'Launcher Skins',
            'Implementation-Version': project.version
        )
    }
}

// The shipped jar: the bundled one in the game's own (obfuscated) names.
remapJar {
    inputFile = shadowJar.archiveFile
    targetNamespace = 'official'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
