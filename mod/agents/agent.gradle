plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

// The Java agent for one release with obfuscated names (before 26.1) and no mod loader:
// `-javaagent:` on the game's command line. Every such release is a project here, a
// folder named after it whose gradle.properties name the game layer and the agent hooks
// it shares with its neighbours. The code is written in Mojang names, then remapped to the
// release's own names. ASM rewrites the class; it is bundled under our own package so it
// cannot clash with anything on the game's class path.
base {
    archivesName = "launcherskins-agent-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets.main {
    java.srcDir "${rootDir}/core/src/main/java"
    java.srcDir "${rootDir}/${game_layer}/src/main/java"
    java.srcDir "${rootDir}/${agent_hooks}"
    java.srcDir "${rootDir}/agent/src/main/java"
    java.exclude 'app/launcher/skins/mixin/**'
}

sourceSets.test {
    java.srcDir "${rootDir}/agent/src/test/java"
}

configurations {
    bundled
    implementation.extendsFrom bundled
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    bundled 'org.ow2.asm:asm:9.9'
    bundled 'org.ow2.asm:asm-tree:9.9'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
}

shadowJar {
    configurations = [project.configurations.bundled]
    relocate 'org.objectweb.asm', 'app.launcher.skins.agent.asm'
    exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/maven/**'
    archiveClassifier = 'named'
    manifest {
        attributes(
            'Premain-Class': 'app.launcher.skins.agent.Agent',
            'Implementation-Title': 'Launcher Skins',
            'Implementation-Version': project.version
        )
    }
}

// The shipped jar: the bundled one in the game's own (obfuscated) names.
remapJar {
    inputFile = shadowJar.archiveFile
    targetNamespace = 'official'
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}
