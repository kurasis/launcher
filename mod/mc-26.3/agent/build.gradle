plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1'
}

// The Java agent for Minecraft 26.3 with no mod loader: `-javaagent:` on the game's
// command line. Loom only supplies the game's classes to compile against; the jar holds
// the core, the game layer shared with the loaders (without its Mixin) and the agent,
// which rewrites PlayerInfo.getSkin() with the JDK's class-file API.
// Also built for the newest snapshot (mc-snapshot/agent), whose gradle.properties name
// the game version and the band (`band`).
base {
    archivesName = "launcherskins-agent-${band}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

sourceSets.main {
    java.srcDirs = ["${rootDir}/core/src/main/java", "${rootDir}/mc-26.3/common/src/main/java",
                    "${rootDir}/mc-26.3/agent/src/main/java"]
    java.exclude 'app/launcher/skins/mixin/**'
}

// The newest snapshot (mc-snapshot) uses its own copy of each class in mc-snapshot/common
// instead of mc-26.3's, where its game code differs from 26.3's.
def ownLayer = file("${projectDir}/../common/src/main/java")
def sharedLayer = file("${rootDir}/mc-26.3/common/src/main/java")
if (ownLayer != sharedLayer && ownLayer.isDirectory()) {
    def replaced = fileTree(ownLayer).collect { ownLayer.toPath().relativize(it.toPath()).toString().replace('\\', '/') } as Set
    sourceSets.main.java.srcDir ownLayer
    sourceSets.main.java.exclude { e -> e.file.path.startsWith(sharedLayer.path) && replaced.contains(e.relativePath.pathString) }
}

sourceSets.test {
    java.srcDirs = ["${rootDir}/mc-26.3/agent/src/test/java"]
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'Premain-Class': 'app.launcher.skins.agent.Agent',
            'Implementation-Title': 'Launcher Skins',
            'Implementation-Version': project.version
        )
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
