plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1'
}

// Also built for the newest snapshot (mc-snapshot/fabric): its gradle.properties name the
// game version, the band (`band`) and the releases the jar accepts (`fabric_range`).
base {
    archivesName = "launcherskins-fabric-${band}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// The core and the game layer shared by every loader of this version are compiled in.
sourceSets.main {
    java.srcDirs = ["${rootDir}/core/src/main/java", "${rootDir}/mc-26.3/common/src/main/java",
                    "${rootDir}/mc-26.3/fabric/src/main/java"]
    resources.srcDirs = ["${rootDir}/mc-26.3/common/src/main/resources",
                         "${rootDir}/mc-26.3/fabric/src/main/resources"]
}

// The newest snapshot (mc-snapshot) uses its own copy of each class in mc-snapshot/common
// instead of mc-26.3's, where its game code differs from 26.3's.
def ownLayer = file("${projectDir}/../common/src/main/java")
def sharedLayer = file("${rootDir}/mc-26.3/common/src/main/java")
if (ownLayer != sharedLayer && ownLayer.isDirectory()) {
    def replaced = fileTree(ownLayer).collect { ownLayer.toPath().relativize(it.toPath()).toString().replace('\\', '/') } as Set
    sourceSets.main.java.srcDir ownLayer
    sourceSets.main.java.exclude { e -> e.file.path.startsWith(sharedLayer.path) && replaced.contains(e.relativePath.pathString) }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', fabric_range
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft: fabric_range
    }
}

// Local testing: ./gradlew runClient -PskinsApi=http://127.0.0.1:8899 -PdevNick=Tester
loom {
    runs {
        client {
            if (project.hasProperty('skinsApi')) {
                vmArg "-Dlauncherskins.api=${project.property('skinsApi')}"
            }
            if (project.hasProperty('devNick')) {
                programArgs '--username', project.property('devNick').toString()
            }
            if (project.hasProperty('devServer')) {
                programArgs '--quickPlayMultiplayer', project.property('devServer').toString()
            }
        }
    }
}
