plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

// The test bot for 1.21.1 with no mod loader, a Java agent (docs/GAMETEST.md). Written in
// Mojang names like the loaders' bot, then remapped to the released (obfuscated) game's
// names. ASM is bundled under our own package.
base {
    archivesName = "launchergametest-agent-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets.main {
    java.srcDir "${rootDir}/gametest/core/src/main/java"
    java.srcDir "${projectDir}/../common/src/main/java"
    java.srcDir "${rootDir}/gametest/agent/src/main/java"
    java.exclude 'app/launcher/gametest/mixin/**'
}

configurations {
    bundled
    implementation.extendsFrom bundled
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    bundled 'org.ow2.asm:asm:9.9'
    bundled 'org.ow2.asm:asm-tree:9.9'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

shadowJar {
    configurations = [project.configurations.bundled]
    relocate 'org.objectweb.asm', 'app.launcher.gametest.agent.asm'
    exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/maven/**'
    archiveClassifier = 'named'
    manifest {
        attributes('Premain-Class': 'app.launcher.gametest.agent.Agent')
    }
}

// The jar the test uses: the bundled one in the game's own names.
remapJar {
    inputFile = shadowJar.archiveFile
    targetNamespace = 'official'
}

repositories {
    mavenCentral()
}
