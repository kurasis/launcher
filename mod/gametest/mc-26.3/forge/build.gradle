plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

base {
    archivesName = "launchergametest-forge-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

sourceSets.main {
    java.srcDir "${rootDir}/gametest/core/src/main/java"
    java.srcDir "${projectDir}/../common/src/main/java"
    resources.srcDir "${projectDir}/../common/src/main/resources"
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Forge ships Mixin; only its annotations are needed to compile.
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'MixinConfigs': 'launchergametest.mixins.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}
