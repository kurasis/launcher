plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1'
}

base {
    archivesName = "launchergametest-fabric-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// The bot and this version's game layer are compiled in.
// Also the bot for the newest snapshot (gametest/mc-snapshot/fabric).
sourceSets.main {
    java.srcDirs = ["${rootDir}/gametest/core/src/main/java", "${rootDir}/gametest/mc-26.3/common/src/main/java"]
    resources.srcDirs = ["${rootDir}/gametest/mc-26.3/common/src/main/resources",
                         "${rootDir}/gametest/mc-26.3/fabric/src/main/resources"]
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft: minecraft_version
    }
}
