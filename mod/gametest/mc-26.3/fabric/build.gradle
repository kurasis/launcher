plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1'
}

base {
    archivesName = "launchergametest-fabric-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// The bot and this version's game layer are compiled in.
// Also the bot for the newest snapshot (gametest/mc-snapshot/fabric).
sourceSets.main {
    java.srcDirs = ["${rootDir}/gametest/core/src/main/java", "${rootDir}/gametest/mc-26.3/common/src/main/java"]
    resources.srcDirs = ["${rootDir}/gametest/mc-26.3/common/src/main/resources",
                         "${rootDir}/gametest/mc-26.3/fabric/src/main/resources"]
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// Fabric reads a snapshot's version as 26.4-alpha.5, never 26.4-snapshot-5: the snapshot's bot
// takes the range of the skins mod's jar (mod/mc-snapshot/fabric).
def minecraftRange = findProperty('fabric_range') ?: minecraft_version

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', minecraftRange
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft: minecraftRange
    }
}
