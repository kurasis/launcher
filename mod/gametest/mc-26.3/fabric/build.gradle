plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1'
}

base {
    archivesName = "launchergametest-fabric-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// The bot and this version's game layer are compiled in.
sourceSets.main {
    java.srcDir "${rootDir}/gametest/core/src/main/java"
    java.srcDir "${projectDir}/../common/src/main/java"
    resources.srcDir "${projectDir}/../common/src/main/resources"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
