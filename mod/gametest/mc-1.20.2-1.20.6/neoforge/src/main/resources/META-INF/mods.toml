modLoader = "javafml"
loaderVersion = "[1,)"
license = "All-Rights-Reserved"

[[mods]]
modId = "launchergametest"
version = "${version}"
displayName = "Launcher Game Test"
description = "The launcher's test bot: plays the game on the test machine and writes a report. Not for players."

[[mixins]]
config = "launchergametest.mixins.json"

[[dependencies.launchergametest]]
modId = "minecraft"
type = "required"
# NeoForge before 20.4 (FML 1: every 1.20.2 and 1.20.3 build) refuses the jar without
# it; FML 2 reads type and passes over it.
mandatory = true
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "CLIENT"
