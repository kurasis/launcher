plugins {
    id 'dev.architectury.loom' version '1.17.493'
}

// The bot for Forge 1.14.4 or 1.15.2 (a project in the folder of its release). These
// releases have no Mixin, so the bot acts on Forge's client tick event instead
// (src/main/java); it takes the release's own game layer from ../game/<release> and the
// descriptors of the 1.16.5 to 1.20.1 bots.
base {
    archivesName = "launchergametest-forge-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

sourceSets.main {
    java.srcDir "${rootDir}/gametest/core/src/main/java"
    java.srcDir "${projectDir}/../../game/${minecraft_version}"
    java.srcDir "${projectDir}/../src/main/java"
    resources.srcDir "${rootDir}/gametest/mc-1.16.5-1.20.1/forge/src/main/resources"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version, minecraft: minecraft_version,
                 forge_major: forge_version.tokenize('.')[0], pack_format: pack_format]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}
