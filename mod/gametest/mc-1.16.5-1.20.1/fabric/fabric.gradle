plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.1'
}

// The bot for Fabric in one release from 1.16.5 to 1.20.1: each is a project here, a
// folder named after the release. They share the Mixin and take the release's own game
// layer from ../game/<release>. 1.16.5 runs on Java 8, so it is Java 8 unless a release's
// layer needs more. The 1.20.2 to 1.20.6 bots (gametest/mc-1.20.2-1.20.6/fabric) are built by
// this script too, with their own game layers.
base {
    archivesName = "launchergametest-fabric-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets.main {
    java.srcDir "${rootDir}/gametest/core/src/main/java"
    java.srcDir "${rootDir}/gametest/mc-1.16.5-1.20.1/common/src/main/java"
    java.srcDir "${projectDir}/../../game/${findProperty('game_layer') ?: minecraft_version}"
    resources.srcDir "${rootDir}/gametest/mc-1.16.5-1.20.1/common/src/main/resources"
    resources.srcDir "${rootDir}/gametest/mc-1.16.5-1.20.1/fabric/src/main/resources"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

tasks.withType(JavaCompile).configureEach {
    // Java 8 unless the release's game layer needs more (java_release in gradle.properties).
    options.release = (findProperty('java_release') ?: '8') as int
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version, minecraft: minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}
