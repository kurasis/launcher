plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

// The bot for Forge in one release from 1.17.1 to 1.20.1 (1.16.5 has a script of its
// own), a folder named after the release. These Forge releases run with SRG names, so the
// jar is reobfuscated and the Mixin refmap maps the bot's target.
base {
    archivesName = "launchergametest-forge-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    // Our classes are Java 8, Forge's libraries Java 17: let both on the class path.
    disableAutoTargetJvm()
}

sourceSets.main {
    java.srcDir "${rootDir}/gametest/core/src/main/java"
    java.srcDir "${projectDir}/../../common/src/main/java"
    java.srcDir "${projectDir}/../../game/${findProperty('game_layer') ?: minecraft_version}"
    java.srcDir "${projectDir}/../src/main/java"
    resources.srcDir "${projectDir}/../../common/src/main/resources"
    resources.srcDir "${projectDir}/../src/main/resources"
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    mods {
        launchergametest {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, 'launchergametest.refmap.json'
    config 'launchergametest.mixins.json'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    // Java 8 unless the release's game layer needs more (java_release in gradle.properties).
    options.release = (findProperty('java_release') ?: '8') as int
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'MixinConfigs': 'launchergametest.mixins.json'
    }
}

processResources {
    def props = [version: project.version, minecraft: minecraft_version,
                 forge_major: forge_version.tokenize('.')[0], pack_format: pack_format]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
    // Mixin finds the SRG names of our targets in the refmap only when the config names it.
    filesMatching('launchergametest.mixins.json') {
        filter { line -> line.replace('"package"', '"refmap": "launchergametest.refmap.json",\n  "package"') }
    }
}
