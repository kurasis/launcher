[package]
name = "kurasis-launcher"
version = "0.1.0"
description = "Independent desktop launcher for Minecraft: Java Edition (provisional name)"
authors = ["Kurasis Launcher contributors"]
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "kurasis_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
regex = "1.13.1"
zeroize = "1.9.1"
tauri-plugin-single-instance = "2.5.4"

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
